# Puts the website on Hostinger by itself.
# When files inside website/ change on the main branch (the owner taps "Merge" on a pull request), only those
# files are uploaded to public_html (FTP, encrypted when the server allows it). Nothing on the server is ever
# deleted, files that are not in website/ (admin.html, PHP files, photos) are never touched, and the server's
# old copy of every replaced file is kept with the run for 90 days (Actions → the run → Artifacts).
#
# One-time setup (repository → Settings → Secrets and variables → Actions → New repository secret):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD   — from hPanel → Files → FTP Accounts
#   FTP_DIR (optional)                       — not needed: the site is /domains/deliverystep.app/public_html
# Until these are added, this workflow only prints a note and uploads nothing.
name: Deploy website to Hostinger

on:
  push:
    branches: [main]
    paths: ['website/**']
  workflow_dispatch:
    inputs:
      files:
        description: 'Files to upload, separated by spaces (e.g. website/terms.html). Empty = the files changed by the last commit. --check = only look at the server, upload nothing.'
        type: string
        default: ''

concurrency:
  group: deploy-website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      READY: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
    steps:
      - name: FTP details not added yet
        if: env.READY != 'true'
        run: echo "::warning::Add the FTP_SERVER, FTP_USERNAME and FTP_PASSWORD secrets to turn on automatic website updates. Nothing was uploaded."

      - uses: actions/checkout@v4
        if: env.READY == 'true'
        with:
          fetch-depth: 0

      - name: List the website files to upload
        if: env.READY == 'true'
        env:
          BEFORE: ${{ github.event.before }}
          PICKED: ${{ inputs.files }}
        run: |
          : > files.txt
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=AMR "$BEFORE" "$GITHUB_SHA" -- website/ > files.txt
            # A normal change touches a few files. Many at once (e.g. months of history arriving together) are never
            # uploaded by themselves — see MAX_FILES below; they can still be uploaded by hand, by name.
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$PICKED" ]; then
            printf '%s\n' $PICKED > files.txt
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            git diff --name-only --diff-filter=AMR "$GITHUB_SHA~1" "$GITHUB_SHA" -- website/ > files.txt
          else
            echo "::warning::Could not tell which files changed. Nothing uploaded — run the workflow by hand and name the files."
          fi
          echo "Files to upload:"; cat files.txt

      - name: Upload to Hostinger
        if: env.READY == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          MAX_FILES: ${{ github.event_name == 'push' && '12' || '0' }}
        run: python3 .github/scripts/deploy_website.py files.txt

      - name: Keep the replaced files
        if: always() && env.READY == 'true' && hashFiles('replaced-files/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: replaced-files-${{ github.run_number }}
          path: replaced-files/
          retention-days: 90
