  <style>
    :root{--rose:#be185d;--rose-dark:#9d174d;--rose-light:#fce7f3;--rose-soft:#fff1f6;--text:#1f1f1f;--muted:#6b7280;--border:#f0e4e9;--bg:#f9f9f9;--white:#fff;--green:#16a34a}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:100px;direction:rtl}
    .topbar{background:var(--rose);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
    .btn-back{background:rgba(255,255,255,0.2);border:none;color:#fff;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;flex-shrink:0}
    .topbar-title{font-size:16px;font-weight:700;color:#fff;flex:1}
    .body{padding:16px;display:flex;flex-direction:column;gap:12px}
    .card{background:#fff;border:0.5px solid var(--border);border-radius:16px;padding:14px}
    .card-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:6px}
    .card-title i{color:var(--rose);font-size:16px}
    .cart-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:0.5px solid var(--border)}
    .cart-item:last-of-type{border-bottom:none}
    .item-icon{width:50px;height:50px;border-radius:10px;overflow:hidden;flex-shrink:0;background:#f3f0ed;display:flex;align-items:center;justify-content:center;font-size:24px}
    .item-icon img{width:100%;height:100%;object-fit:cover}
    .item-body{flex:1}
    .item-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px}
    .item-price{font-size:12px;color:var(--rose-dark);font-weight:700}
    .qty-ctrl{display:flex;align-items:center;gap:8px}
    .qty-btn{width:28px;height:28px;border-radius:8px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:all 0.2s}
    .qty-m{background:var(--rose-light);color:var(--rose)}
    .qty-p{background:var(--rose);color:#fff}
    .qty-n{font-size:14px;font-weight:700;min-width:20px;text-align:center}
    .row-total{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:0.5px solid var(--border)}
    .row-total:last-of-type{border-bottom:none}
    .grand-total{display:flex;justify-content:space-between;font-size:16px;font-weight:700;padding:10px 0 0;border-top:1px solid var(--border);margin-top:6px}
    .grand-total .v{color:var(--rose-dark)}
    .empty-cart{text-align:center;padding:4rem 2rem}
    .empty-cart i{font-size:64px;color:var(--rose-light);display:block;margin-bottom:1rem}
    .empty-title{font-size:18px;font-weight:700;margin-bottom:8px}
    .empty-sub{font-size:13px;color:var(--muted);margin-bottom:1.5rem}
    .checkout-bar{position:fixed;bottom:0;right:50%;transform:translateX(50%);width:100%;max-width:480px;background:#fff;border-top:0.5px solid var(--border);padding:12px 16px;z-index:100}
    .checkout-btn{width:100%;background:var(--rose);color:#fff;border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Tajawal',sans-serif;box-shadow:0 4px 12px rgba(190,24,93,0.3);transition:all 0.2s}
    .checkout-btn:active{background:var(--rose-dark)}
    .checkout-btn.blocked{background:#9ca3af;font-size:14px}
    .ds-rule{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;font-size:13.5px;font-weight:700;line-height:1.7}
    .ds-rule.pause{background:#fef2f2;border:1.5px solid #fca5a5;color:#991b1b}
    .ds-rule.min{background:#fffbeb;border:1.5px solid #fcd34d;color:#92400e}
    .ds-rule.max{background:#eff6ff;border:1.5px solid #93c5fd;color:#1e3a8a}
    .ds-rule a{align-self:flex-start;text-decoration:none;color:#fff;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:800}
    .ds-rule.min a{background:#b45309}
    .ds-rule.max a{background:#15803d}
    .promo-wrap{display:flex;gap:8px;margin-top:10px}
    .promo-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:13px;outline:none;font-family:'Tajawal',sans-serif;color:var(--text);direction:rtl}
    .promo-input:focus{border-color:var(--rose)}
    .promo-btn{background:var(--rose);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Tajawal',sans-serif}
    .toast{position:fixed;bottom:100px;right:50%;transform:translateX(50%);background:#1f1f1f;color:#fff;font-size:13px;padding:10px 20px;border-radius:20px;white-space:nowrap;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999}
    .toast.show{opacity:1}
  </style>

<script>
const sb = supabase.createClient('https://vjuhxpttssmyomqqomdx.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqdWh4cHR0c3NteW9tcXFvbWR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5MjQxNjAsImV4cCI6MjA5NDUwMDE2MH0.JiGnmOEPPM3dka-KHIm5mEFs7GWb4Amsnp6R57r7Lro');

let appliedCoupon = null; // {code, discount_percent, discount_amount}
let _smDeliveryFee = 5.5;
let _smFreeMin = 200;
let _twoVendorFee = 7; // delivery fee when the cart has TWO vendors
let _settingsLoaded = false;
async function loadDeliverySettings(){
  try{
    const{data,error}=await sb.from('settings').select('key,value').in('key',['supermarket_delivery_fee','supermarket_free_delivery_min','supermarket_discount_min','supermarket_discount_fee','two_vendor_delivery_fee','supermarket_min_order','supermarket_max_order','orders_paused','orders_paused_msg']);
    if(error){console.warn('Settings load error:',error);return;}
    if(data&&data.length){
      data.forEach(s=>{
        if(s.key==='supermarket_delivery_fee'){const v=Number(s.value);if(!isNaN(v))_smDeliveryFee=v;}
        if(s.key==='supermarket_free_delivery_min'){const v=Number(s.value);if(!isNaN(v))_smFreeMin=v;}
        if(s.key==='two_vendor_delivery_fee'){const v=Number(s.value);if(!isNaN(v)&&v>0)_twoVendorFee=v;}
        _dsRule(s.key,s.value);
      });
      _settingsLoaded=true;
    }
  }catch(e){console.warn('Settings load fail:',e);}
}

/* ── Two-vendor cart helpers ── */
const _SM_VENDOR='السوبرماركت';
function _vendorOf(i){return i.vendor||i.restaurant||_SM_VENDOR;}
function cartVendors(cart){return [...new Set(cart.map(_vendorOf))];}

/* ═══ Rules from Admin → Settings: pause orders, supermarket minimum / maximum ═══
   Minimum / maximum count only the supermarket items in the cart. */
let _smMin=0, _smMax=0, _ordersPaused=false, _pausedMsg='', _smDiscMin=0, _smDiscFee=0;
// Supermarket delivery: free from _smFreeMin · cheaper fee from _smDiscMin · otherwise the normal fee
function _smTierOn(){ return _smDiscMin>0&&_smDiscFee<_smDeliveryFee&&!(_smFreeMin>0&&_smDiscMin>=_smFreeMin); }
function _smFee(sub){ if(_smFreeMin>0&&sub>=_smFreeMin)return 0; if(_smTierOn()&&sub>=_smDiscMin)return _smDiscFee; return _smDeliveryFee; }
function _smFeeHint(sub){   // "add X SAR → cheaper / free delivery"
  if(_smFreeMin>0&&sub>=_smFreeMin)return '';
  if(_smTierOn()&&sub<_smDiscMin)return '🚚 أضف '+_dsFmt(_smDiscMin-sub)+' ريال ويصير التوصيل '+_dsFmt(_smDiscFee)+' ريال بدل '+_dsFmt(_smDeliveryFee);
  if(_smFreeMin>0)return '🚚 أضف '+_dsFmt(_smFreeMin-sub)+' ريال لتوصيل مجاني';
  return '';
}
const _DS_WA='966560957163';
function _dsRule(k,v){
  if(k==='supermarket_min_order'){ const n=Number(v); _smMin=(!isNaN(n)&&n>0)?n:0; }
  else if(k==='supermarket_max_order'){ const n=Number(v); _smMax=(!isNaN(n)&&n>0)?n:0; }
  else if(k==='orders_paused') _ordersPaused=String(v)==='1';
  else if(k==='orders_paused_msg') _pausedMsg=String(v||'').trim();
  else if(k==='supermarket_discount_min'){ const n=Number(v); _smDiscMin=(!isNaN(n)&&n>0)?n:0; }
  else if(k==='supermarket_discount_fee'){ const n=Number(v); _smDiscFee=(!isNaN(n)&&n>=0)?n:0; }
}
function _dsFmt(n){ return String(Math.round(n*100)/100); }   // 3.5 → "3.5", 8 → "8"
function _isSmItem(i,isRest){ const v=i.vendor||i.restaurant; return v?v===_SM_VENDOR:!isRest; }
function _smSubtotal(cart){ const isRest=!!localStorage.getItem('qibah_restaurant'); return cart.filter(i=>_isSmItem(i,isRest)).reduce((s,i)=>s+Number(i.price)*Number(i.qty),0); }
function _orderBlock(cart){   // null = the order may go ahead
  if(_ordersPaused)return {kind:'pause',text:_pausedMsg||'الطلبات متوقفة مؤقتاً — نعود قريباً 🙏',short:'⏸️ الطلبات متوقفة مؤقتاً'};
  const sm=_smSubtotal(cart);
  if(sm>0&&_smMin>0&&sm<_smMin)return {kind:'min',text:'الحد الأدنى لطلب السوبرماركت '+_dsFmt(_smMin)+' ريال — أضف '+_dsFmt(_smMin-sm)+' ريال لإكمال الطلب',short:'أضف '+_dsFmt(_smMin-sm)+' ريال من السوبرماركت للمتابعة'};
  if(sm>0&&_smMax>0&&sm>_smMax)return {kind:'max',text:'الحد الأعلى لطلب السوبرماركت '+_dsFmt(_smMax)+' ريال — للطلبات الكبيرة تواصل معنا على واتساب',short:'الطلب أكبر من الحد الأعلى ('+_dsFmt(_smMax)+' ريال)'};
  return null;
}
function _dsRuleCard(b){
  if(!b)return '';
  const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon=b.kind==='pause'?'⏸️ ':b.kind==='min'?'🛒 ':'📦 ';
  const act=b.kind==='min'?'<a href="/pages/supermarket.html?v=14">أكمل التسوق</a>'
    :b.kind==='max'?'<a href="https://wa.me/'+_DS_WA+'?text='+encodeURIComponent('مرحباً، أريد طلب سوبرماركت كبير')+'" target="_blank" rel="noopener">تواصل معنا واتساب</a>':'';
  return '<div class="ds-rule '+b.kind+'" id="ds-rule"><div>'+icon+esc(b.text)+'</div>'+act+'</div>';
}
function _dsApplyButton(b){
  const go=document.getElementById('checkout-go'), bl=document.getElementById('checkout-blocked');
  if(!go||!bl)return;
  go.style.display=b?'none':''; bl.style.display=b?'':'none';
  if(b)document.getElementById('checkout-block-txt').textContent=b.short;
}
function goCheckout(){
  const b=_orderBlock(JSON.parse(localStorage.getItem('qibah_cart')||'[]'));
  if(b){ showToast(b.text); _dsApplyButton(b); return; }
  window.location.href='/pages/checkout.html?v=14';   // ?v= → never an old saved copy
}
function _cartBlockedTap(){
  const b=_orderBlock(JSON.parse(localStorage.getItem('qibah_cart')||'[]'));
  if(!b){ _dsApplyButton(null); return goCheckout(); }
  showToast(b.text);
  const c=document.getElementById('ds-rule'); if(c)c.scrollIntoView({behavior:'smooth',block:'center'});
}

async function loadCart() {
  if(!_settingsLoaded) await loadDeliverySettings();
  const cart = JSON.parse(localStorage.getItem('qibah_cart') || '[]');
  const content = document.getElementById('cart-content');
  const bar = document.getElementById('checkout-bar');

  if (!cart.length) {
    bar.style.display = 'none';
    content.innerHTML = `
      <div class="empty-cart">
        <i class="ti ti-shopping-cart" aria-hidden="true"></i>
        <div class="empty-title">سلتك فارغة!</div>
        <div class="empty-sub">أضف منتجات من المطاعم والمحلات</div>
        <button onclick="window.location.href='/?v=14'" style="background:var(--rose);color:#fff;border:none;border-radius:12px;padding:12px 28px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Tajawal',sans-serif">
          تصفح المطاعم
        </button>
      </div>`;
    return;
  }

  const sub = cart.reduce((s,i) => s + i.price*i.qty, 0);
  const vendors = cartVendors(cart);
  const twoVendors = vendors.length >= 2;
  const savedFee = localStorage.getItem('qibah_delivery_fee');
  const isRest = localStorage.getItem('qibah_restaurant');
  // Two vendors: flat two-vendor fee (7 SR default)
  // Restaurant order: use saved restaurant fee
  // Supermarket order (no restaurant): ALWAYS use latest settings, ignore stale localStorage
  let del;
  if(twoVendors){
    del = _twoVendorFee;
  }else if(isRest && savedFee !== null){
    del = Number(savedFee);
  }else if(vendors.length===1 && vendors[0]!==_SM_VENDOR){
    // Single restaurant left (e.g. after removing the 2nd vendor) — use its own fee from item tags
    const vf = cart.find(i => _vendorOf(i)===vendors[0] && i.vendor_fee!=null);
    del = vf ? Number(vf.vendor_fee) : _smDeliveryFee;
  }else{
    del = _smFee(sub);
    // Clean up stale supermarket fee in localStorage
    if(!isRest && savedFee !== null) localStorage.removeItem('qibah_delivery_fee');
  }
  const disc = appliedCoupon ? appliedCoupon.discount_amount : 0;
  const tot = sub + del - disc;

  bar.style.display = 'block';
  document.getElementById('checkout-total').textContent = tot.toFixed(2) + ' ريال';
  const _blk = _orderBlock(cart);
  _dsApplyButton(_blk);

  // Vendor banner: single restaurant (classic) OR two-vendor combo
  const rest = JSON.parse(localStorage.getItem('qibah_restaurant') || 'null');
  let restBanner = '';
  if (twoVendors) {
    restBanner = `
    <div class="card" style="background:linear-gradient(135deg,#fff7ed,#fff1f6);border-color:#fde4d3">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:40px;height:40px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">🛍️</div>
        <div>
          <div style="font-size:13px;font-weight:700">طلبك من متجرين: ${vendors.join(' + ')}</div>
          <div style="font-size:11px;color:#b45309;font-weight:700">رسوم التوصيل من متجرين: ${_twoVendorFee} ريال 🛵</div>
        </div>
      </div>
    </div>`;
  } else if (rest) {
    restBanner = `
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:40px;height:40px;background:var(--rose-soft);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">🍽️</div>
        <div>
          <div style="font-size:13px;font-weight:700">${rest.name}</div>
          <div style="font-size:11px;color:var(--muted)">طلبك من هذا المطعم</div>
        </div>
      </div>
    </div>`;
  }

  // Items grouped by vendor (headers only when 2 vendors)
  const groups = {};
  cart.forEach(i => { const v=_vendorOf(i); (groups[v]=groups[v]||[]).push(i); });
  const itemRow = item => `
          <div class="cart-item">
            <div class="item-icon${item.image ? '' : ' ds-ph'}">
              ${item.image ? `<img src="${dsImg(item.image,160)}" alt="${item.name}" loading="lazy" decoding="async" onerror="dsImgRetry(this)||(this.parentNode.classList.add('ds-ph'),this.remove())"/>` : ''}
            </div>
            <div class="item-body">
              <div class="item-name">${item.name}</div>
              <div class="item-price">SAR ${item.price.toFixed(2)}</div>
            </div>
            <div class="qty-ctrl">
              <button class="qty-btn qty-m" onclick="changeQty('${item.id}',-1)"><i class="ti ti-minus" style="font-size:11px"></i></button>
              <span class="qty-n">${item.qty}</span>
              <button class="qty-btn qty-p" onclick="changeQty('${item.id}',1)"><i class="ti ti-plus" style="font-size:11px"></i></button>
            </div>
          </div>`;
  const itemsHtml = vendors.map(v => `
        ${twoVendors?`<div style="display:flex;align-items:center;gap:6px;background:var(--rose-soft);border-radius:8px;padding:6px 10px;margin:8px 0 2px;font-size:12px;font-weight:700;color:var(--rose-dark)">🏪 ${v}</div>`:''}
        ${groups[v].map(itemRow).join('')}`).join('');

  content.innerHTML = `
    <div class="body">
      ${_dsRuleCard(_blk)}
      ${restBanner}
      <div class="card">
        <div class="card-title"><i class="ti ti-shopping-bag" aria-hidden="true"></i>منتجاتي (${cart.reduce((s,i)=>s+i.qty,0)} منتج)</div>
        ${itemsHtml}
      </div>

      <div class="card">
        <div class="card-title"><i class="ti ti-ticket" aria-hidden="true"></i>رمز الخصم</div>
        <div class="promo-wrap">
          <input class="promo-input" id="promo-input" placeholder="أدخل رمز الخصم"/>
          <button class="promo-btn" onclick="applyPromo()">تطبيق</button>
        </div>
        <div id="promo-msg" style="font-size:12px;margin-top:6px;display:none"></div>
      </div>

      <div class="card">
        <div class="card-title"><i class="ti ti-receipt" aria-hidden="true"></i>ملخص الطلب</div>
        <div class="row-total"><span style="color:var(--muted)">المجموع الفرعي</span><span>SAR ${sub.toFixed(2)}</span></div>
        <div class="row-total"><span style="color:var(--muted)">رسوم التوصيل${twoVendors?' (متجرين)':''}</span><span id="del-val" style="color:${del===0?'var(--green)':'inherit'}">${del===0?'مجاني 🎉':'SAR '+del.toFixed(2)}</span></div>
        ${twoVendors?`<div style="font-size:11px;color:#b45309;background:#fffbeb;border-radius:8px;padding:7px 10px;margin:6px 0">🛵 لأن طلبك من متجرين مختلفين، رسوم التوصيل ${_twoVendorFee} ريال</div>`:''}
        ${(!twoVendors&&!isRest&&vendors.length===1&&vendors[0]===_SM_VENDOR&&_smFeeHint(sub))?`<div id="sm-fee-hint" style="font-size:11.5px;font-weight:700;color:#15803d;background:#f0fdf4;border-radius:8px;padding:7px 10px;margin:6px 0">${_smFeeHint(sub)}</div>`:''}
        ${disc>0?`<div class="row-total"><span style="color:var(--muted)">الخصم (${appliedCoupon.code} ${appliedCoupon.discount_percent}%)</span><span style="color:var(--green)">-SAR ${disc.toFixed(2)}</span></div>`:''}
        <div class="grand-total"><span>الإجمالي</span><span class="v">SAR ${tot.toFixed(2)}</span></div>
      </div>
    </div>`;
}

function changeQty(id, delta) {
  let cart = JSON.parse(localStorage.getItem('qibah_cart') || '[]');
  const idx = cart.findIndex(i => i.id === id);
  if (idx >= 0) {
    cart[idx].qty = Math.max(0, cart[idx].qty + delta);
    if (cart[idx].qty === 0) cart.splice(idx, 1);
  }
  localStorage.setItem('qibah_cart', JSON.stringify(cart));
  loadCart();
}

function clearCart() {
  if (!confirm('هل تريد مسح السلة؟')) return;
  localStorage.removeItem('qibah_cart');
  localStorage.removeItem('qibah_restaurant');
  localStorage.removeItem('qibah_delivery_fee');
  loadCart();
  showToast('تم مسح السلة');
}

async function applyPromo() {
  const code = document.getElementById('promo-input').value.trim().toUpperCase();
  const msg = document.getElementById('promo-msg');
  const btn = document.querySelector('.promo-btn');
  if (!code) return;

  msg.style.display = 'block';
  msg.style.color = 'var(--muted)';
  msg.textContent = '...جاري التحقق';
  btn.disabled = true;

  try {
    const { data, error } = await sb.from('coupons').select('*').eq('code', code).single();

    if (error || !data) {
      msg.style.color = '#be185d';
      msg.textContent = 'رمز الخصم غير صحيح';
      appliedCoupon = null;
      loadCart();
      btn.disabled = false;
      return;
    }

    if (!data.is_active) {
      msg.style.color = '#be185d';
      msg.textContent = 'هذا الكود غير نشط حالياً';
      appliedCoupon = null;
      loadCart();
      btn.disabled = false;
      return;
    }

    if (data.expires_at && new Date(data.expires_at) < new Date()) {
      msg.style.color = '#be185d';
      msg.textContent = 'انتهت صلاحية هذا الكود';
      appliedCoupon = null;
      loadCart();
      btn.disabled = false;
      return;
    }

    if (data.max_uses && data.used_count >= data.max_uses) {
      msg.style.color = '#be185d';
      msg.textContent = 'تم استنفاد استخدامات هذا الكود';
      appliedCoupon = null;
      loadCart();
      btn.disabled = false;
      return;
    }

    const cart = JSON.parse(localStorage.getItem('qibah_cart') || '[]');
    const sub = cart.reduce((s,i) => s + i.price*i.qty, 0);

    if (data.min_order_amount > 0 && sub < data.min_order_amount) {
      msg.style.color = '#be185d';
      msg.textContent = `الحد الأدنى للطلب ${data.min_order_amount} ريال لاستخدام هذا الكود`;
      appliedCoupon = null;
      loadCart();
      btn.disabled = false;
      return;
    }

    const discountAmount = +(sub * data.discount_percent / 100).toFixed(2);
    appliedCoupon = { code: data.code, discount_percent: data.discount_percent, discount_amount: discountAmount };
    msg.style.color = '#16a34a';
    msg.textContent = `✓ تم تطبيق الخصم! خصم ${data.discount_percent}% = ${discountAmount} ريال`;
    loadCart();
  } catch(e) {
    msg.style.color = '#be185d';
    msg.textContent = 'حدث خطأ، حاول مرة أخرى';
  }
  btn.disabled = false;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

window.addEventListener('load', async () => {
  await loadDeliverySettings();
  await loadCart();
});
</script>
<script src="/ds-lib/ds-cart-remind-1.js" defer></script>
</body>
</html>
