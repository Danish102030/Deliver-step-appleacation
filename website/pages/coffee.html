    .glass-nav-wrap{position:fixed;bottom:0;right:50%;transform:translateX(50%);width:100%;max-width:480px;padding:8px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,rgba(255,253,245,1) 60%,rgba(255,253,245,0));pointer-events:none;z-index:200;will-change:transform}

    .gnav-item{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:6px 4px;border-radius:20px}
    .gnav-icon{font-size:22px;color:var(--muted)}

    .toast{position:fixed;bottom:100px;right:50%;transform:translateX(50%);background:#1f1f1f;color:#fff;font-size:13px;padding:10px 20px;border-radius:20px;white-space:nowrap;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999}
    .toast.show{opacity:1}
    .empty{text-align:center;padding:3rem;color:var(--muted)}
    .empty i{font-size:48px;opacity:0.3;display:block;margin-bottom:1rem}
  </style>

const catIcons={coffee:'☕',dessert:'🍰',juice:'🥤',bakery:'🥐',icecream:'🍦'};
const catBg={coffee:'linear-gradient(135deg,#78350f,#d97706)',dessert:'linear-gradient(135deg,#9d174d,#ec4899)',juice:'linear-gradient(135deg,#065f46,#16a34a)',bakery:'linear-gradient(135deg,#92400e,#d97706)',icecream:'linear-gradient(135deg,#7c3aed,#a855f7)'};

function vStatus(v){
  if(v.is_open===false)return{open:false,pill:'مغلق مؤقتاً',cls:'rc-closed'};
  if(v.is_24h)return{open:true,pill:'٢٤ ساعة',cls:'rc-open'};

  if(ev&&ev.stopPropagation)ev.stopPropagation();
  var v=(typeof _favVendorById==='function'&&_favVendorById(id))||{id:id};
  var favs=_getFavs();var idx=-1;for(var k=0;k<favs.length;k++){if(String(favs[k].id)===String(id)){idx=k;break;}}
  var on;if(idx>-1){favs.splice(idx,1);on=false;}else{favs.push({id:id,name:v.name||'',category:v.category||'',delivery_fee:Number(v.delivery_fee)||0,url:'/pages/menu.html?id='+id});on=true;}
  try{localStorage.setItem('ds_favorites',JSON.stringify(favs));}catch(e){}
  var hs=document.querySelectorAll('[data-fav="'+id+'"]');for(var j=0;j<hs.length;j++){hs[j].innerHTML=on?'❤️':'🤍';}
  if(typeof showToast==='function')showToast(on?'❤️ أُضيف إلى المفضلة':'أُزيل من المفضلة');
  try{if(navigator.vibrate)navigator.vibrate(30);}catch(e){}
  return false;
}
async function loadShops(){
  const CK='qibah_cache_coffee';
  let _paintedSig='';
  // Instant paint from cache → no flash when coming back from a menu
  try{const c=sessionStorage.getItem(CK);if(c){allShops=JSON.parse(c)||[];if(allShops.length){renderFeatured();renderShops();_paintedSig=c;}}}catch(e){}
  try{
    const race=await Promise.race([
      sb.from('restaurants').select('*').order('sort_order'),
      new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),6000))
    ]);
    const{data,error}=race;
    if(error)console.error(error);
    const all=data||[];
    let list=all.filter(r=>COFFEE_CATS.includes(r.category)||_alsoIn(r,'coffee'));
    if(!list.length&&all.length) list=all;
    allShops=list;
    if(list.length){try{sessionStorage.setItem(CK,JSON.stringify(list));}catch(e){}}
  }catch(e){console.error('loadShops:',e.message);/* keep cached list on error */}
  // Only repaint if the list actually changed → no flash on the second visit
  if(JSON.stringify(allShops)!==_paintedSig){renderFeatured();renderShops();}
}
function updateCartCount(){const cart=JSON.parse(localStorage.getItem('qibah_cart')||'[]');document.getElementById('cart-count').textContent=cart.reduce((s,i)=>s+i.qty,0)||'٠';}
function renderFeatured(){
  const list=allShops.filter(s=>s.is_open).slice(0,4);
  if(!list.length){document.getElementById('featured-scroll').innerHTML='';return;}
  document.getElementById('featured-scroll').innerHTML=list.map(s=>{
    const icon=catIcons[s.category]||'☕';const bg=catBg[s.category]||'linear-gradient(135deg,#78350f,#d97706)';
    return `<div class="feat-card" onclick="window.location.href='/pages/menu.html?id=${s.id}'">
      <div class="feat-img">${s.banner_url?`<img src="${s.banner_url}" loading="lazy"/>`:`<div style="width:100%;height:100%;background:${bg};display:flex;align-items:center;justify-content:center;font-size:48px">${icon}</div>`}<div class="feat-overlay"></div><div class="feat-badge">مميز</div></div>
      <div class="feat-info"><div class="feat-name">${s.name}</div>
      <div class="feat-meta"><span style="color:#f59e0b;display:flex;align-items:center;gap:2px"><i class="ti ti-star-filled" style="font-size:11px"></i> ${s.rating||'5.0'}</span><span>· ${s.delivery_time||'15-30'} د</span><span style="color:#16a34a">· ${Number(s.delivery_fee)===0?'مجاني':'SAR '+s.delivery_fee}</span></div></div></div>`;
  }).join('');
}
function setFilter(f,el){currentFilter=f;document.querySelectorAll('.fpill').forEach(p=>p.classList.remove('act'));el.classList.add('act');renderShops();}
function filterShops(){currentSearch=document.getElementById('search-input').value.toLowerCase();renderShops();}
function renderShops(){
  let list=[...allShops];
  list.sort((a,b)=>(_vHasOffer(b)?1:0)-(_vHasOffer(a)?1:0)); // offer vendors first
  if(currentFilter!=='all')list=list.filter(s=>s.category===currentFilter);
  if(currentSearch)list=list.filter(s=>s.name.toLowerCase().includes(currentSearch)||(s.name_ar||'').includes(currentSearch));
  document.getElementById('shop-count').textContent=list.length+' محل · قبة';
  if(!list.length){document.getElementById('coffee-list').innerHTML='<div class="empty"><i class="ti ti-coffee"></i>لا توجد محلات حالياً</div>';return;}
  document.getElementById('coffee-list').innerHTML=list.map(s=>vendorCard(s)).join('');
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
document.addEventListener('DOMContentLoaded',()=>{
  if(typeof supabase==='undefined'){
    document.getElementById('coffee-list').innerHTML='<div class="empty"><i class="ti ti-wifi-off"></i>تعذر الاتصال، أعد تحميل الصفحة</div>';
    return;
  }
  sb=supabase.createClient(SB_URL,SB_KEY);
  updateCartCount();
  loadShops();
});
</script>
<script src="/ds-lib/ds-cart-remind-1.js" defer></script>
