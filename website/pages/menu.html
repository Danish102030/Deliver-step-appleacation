<html lang="ar" dir="rtl">
<head>

  <title>القائمة - خطوة التوصيل</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" media="print" onload="this.media='all'"/>

  <link rel="preload" as="script" href="/ds-lib/supabase-js-2.117.1.js"/>
  <style>
    :root{--rose:#be185d;--rose-dark:#9d174d;--rose-light:#fce7f3;--rose-soft:#fff1f6;--text:#1f1f1f;--muted:#6b7280;--border:#f0e4e9;--bg:#f9f9f9;--white:#fff;--green:#16a34a;--amber:#d97706}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:100px;direction:rtl}
    .rest-header{position:relative;height:200px}
    .rest-header img{width:100%;height:100%;object-fit:cover}
    .header-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.75),rgba(0,0,0,0.1))}
    .header-btns{position:absolute;top:12px;right:12px;left:12px;display:flex;justify-content:space-between}
    .hbtn{background:rgba(255,255,255,0.2);border:none;color:#fff;width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;backdrop-filter:blur(10px)}
    .cart-badge-wrap{position:relative}
    .hcart-dot{position:absolute;top:-4px;left:-4px;width:16px;height:16px;background:var(--rose);border-radius:50%;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff}
    .header-info{position:absolute;bottom:0;left:0;right:0;padding:16px;display:flex;align-items:flex-end;gap:12px}
    .rest-logo{width:54px;height:54px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;border:2px solid #fff;flex-shrink:0;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.2)}
    .rest-logo img{width:100%;height:100%;object-fit:cover}
    .rest-header-title{color:#fff;font-size:17px;font-weight:700;margin-bottom:2px}
    .rest-header-sub{font-size:11px;color:rgba(255,255,255,0.8)}
    .info-strip{background:#fff;padding:10px 16px;display:flex;align-items:center;gap:16px;border-bottom:0.5px solid var(--border);overflow-x:auto}
    .info-strip::-webkit-scrollbar{display:none}
    .info-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);flex-shrink:0}
    .info-item i{font-size:14px;color:var(--rose)}
    .info-val{font-weight:700;color:var(--text)}
    .cat-tabs{background:#fff;border-bottom:0.5px solid var(--border);display:flex;gap:4px;overflow-x:auto;position:sticky;top:0;z-index:10;padding:10px 8px 8px;box-shadow:0 4px 10px rgba(0,0,0,.04);scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
    .cat-tabs:empty{display:none}
    .cat-tabs::-webkit-scrollbar{display:none}
    .cat-tab{width:72px;flex-shrink:0;text-align:center;cursor:pointer;font-family:'Tajawal',sans-serif;-webkit-tap-highlight-color:transparent}
    .cat-ic{width:54px;height:54px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1;border:2.5px solid transparent;box-shadow:0 2px 6px rgba(0,0,0,.08);transition:border-color .2s,box-shadow .2s,transform .2s}
    .cat-nm{font-size:11.5px;font-weight:700;color:#374151;margin-top:5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;transition:color .2s}
    .cat-k{font-size:9.5px;color:var(--muted);font-weight:600}
    .cat-tab.act .cat-ic{border-color:var(--rose);box-shadow:0 0 0 3px #fce7f3;transform:scale(1.04)}
    .cat-tab.act .cat-nm{color:var(--rose)}
    .menu-section{scroll-margin-top:118px}
    .sec-ic{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
    .sec-k{font-size:11px;color:var(--muted);font-weight:600}
    .ci1{background:#fde4cf}.ci2{background:#fef3c7}.ci3{background:#fee2e2}.ci4{background:#dcfce7}.ci5{background:#e0e7ff}.ci6{background:#fce7f3}.ci7{background:#cffafe}.ci8{background:#ede9fe}
    .menu-section{padding:14px 16px 4px}
    .menu-sec-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .menu-sec-title::after{content:'';flex:1;height:1px;background:var(--border);margin-right:8px}
    .menu-item{background:#fff;border:none;border-radius:18px;padding:13px;display:flex;gap:13px;margin-bottom:12px;cursor:pointer;box-shadow:0 5px 18px rgba(15,23,42,.06)}
    .menu-item:active{border-color:var(--rose)}
    .menu-item-img{width:84px;height:84px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#f3f0ed}
    #rest-banner-img{transition:opacity .15s}
    #rest-banner-img.dsfade{opacity:0}
    .menu-item-img-fallback{width:84px;height:84px;border-radius:10px;background:var(--rose-soft);display:flex;align-items:center;justify-content:center;font-size:36px;flex-shrink:0}
    .menu-item-info{flex:1;display:flex;flex-direction:column;justify-content:space-between}
    .item-name{font-size:14.5px;font-weight:800;color:var(--text);margin-bottom:3px}
    .item-desc{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:8px}
    .item-footer{display:flex;align-items:center;justify-content:space-between}
    .item-price{font-size:18px;font-weight:900;color:var(--rose-dark);display:inline-flex;align-items:center;gap:3px}
    .item-price .from-lbl{font-size:11px;color:var(--muted);font-weight:700;margin-left:1px}
    .cust-chip{display:inline-flex;align-items:center;gap:4px;background:var(--rose-soft);color:var(--rose-dark);font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:7px;margin:2px 0 8px}
    .add-btn{width:44px;height:44px;background:linear-gradient(135deg,#fb7185,var(--rose-dark));color:#fff;border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:0 7px 18px -4px rgba(190,24,93,.6);transition:transform .12s}
    .add-btn:active{transform:scale(.88)}
    .rs{display:inline-block;width:.82em;height:.9em;vertical-align:-.08em}
    .rs svg{width:100%;height:100%;display:block}
    .add-btn:active{background:var(--rose-dark)}
    .qty-ctrl{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#fb7185,var(--rose-dark));border-radius:16px;padding:4px;box-shadow:0 6px 16px -4px rgba(190,24,93,.5);animation:step-in .26s cubic-bezier(.34,1.56,.64,1)}
    .qty-btn{width:34px;height:34px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;transition:transform .1s}
    .qty-btn:active{transform:scale(.86)}
    .qty-m{background:rgba(255,255,255,.22);color:#fff}
    .qty-p{background:#fff;color:var(--rose-dark)}
    .qty-n{font-size:16px;font-weight:900;min-width:22px;text-align:center;color:#fff}
    @keyframes step-in{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
    .qty-p.bounce{animation:btn-bounce .3s cubic-bezier(.36,.07,.19,.97)}
    @keyframes btn-bounce{0%{transform:scale(1)}40%{transform:scale(1.4) rotate(-8deg)}70%{transform:scale(.88) rotate(4deg)}100%{transform:scale(1) rotate(0)}}
    .qty-n.bump{animation:num-bump .28s cubic-bezier(.36,.07,.19,.97)}
    @keyframes num-bump{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.35)}100%{transform:translateY(0) scale(1)}}
    .out-stock-badge{background:#fee2e2;color:#dc2626;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700}
    .cart-bar{position:fixed;bottom:16px;right:50%;transform:translateX(50%);width:calc(100% - 32px);max-width:448px;background:var(--rose);border-radius:16px;padding:11px 15px 12px;display:none;flex-direction:column;cursor:pointer;box-shadow:0 8px 24px rgba(190,24,93,0.4);z-index:100}
    .cart-bar.show{display:flex}
    .fd-row{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;margin-bottom:9px;border-bottom:1px solid rgba(255,255,255,0.18)}
    .fd-text{font-size:12.5px;font-weight:700;color:#fff;display:flex;align-items:center;gap:4px;line-height:1.25;flex-wrap:wrap}
    .fd-text b{font-weight:900}
    .fd-text .new-fee{font-weight:900}
    .fd-text .old-fee{opacity:.85;text-decoration:line-through;text-decoration-color:#ff5b5b;text-decoration-thickness:2px;font-weight:700}
    .fd-track{height:7px;border-radius:6px;background:rgba(255,255,255,0.24);overflow:hidden}
    .fd-fill{height:100%;border-radius:6px;background:#fff;width:0;transition:width .5s cubic-bezier(.22,.61,.36,1)}
    .fd-fill.done{background:linear-gradient(90deg,#ffe08a,#ffd24d)}
    .cb-main{display:flex;align-items:center;justify-content:space-between}
    .cb-left{display:flex;align-items:center;gap:9px}
    .cart-count-pill{background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.35);color:#fff;font-size:14px;font-weight:900;padding:4px 11px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;direction:ltr}
    .cart-count-pill svg{width:16px;height:16px}
    .cart-bar-text{font-size:14px;font-weight:800;color:#fff}
    .cart-bar-total{font-size:15px;font-weight:900;color:#fff}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
    .modal-overlay.show{display:flex}
    .modal{background:#fff;border-radius:24px 24px 0 0;padding:1.5rem;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
    .modal-title{font-size:16px;font-weight:700;margin-bottom:6px}
    .modal-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
    .modal-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid var(--border)}
    .modal-item:last-of-type{border-bottom:none}
    .modal-total{display:flex;justify-content:space-between;font-size:15px;font-weight:700;padding:12px 0 0;border-top:1px solid var(--border);margin-top:8px}
    .modal-total .v{color:var(--rose-dark)}
    .btn-checkout{width:100%;background:var(--rose);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Tajawal',sans-serif;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-cancel{width:100%;background:var(--bg);border:0.5px solid var(--border);border-radius:12px;padding:12px;font-size:13px;cursor:pointer;margin-top:8px;font-family:'Tajawal',sans-serif;font-weight:700}
    .header-bg{width:100%;height:100%;background:#ebe6e2;display:flex;align-items:center;justify-content:center;font-size:64px}
    .toast{position:fixed;bottom:100px;right:50%;transform:translateX(50%);background:#1f1f1f;color:#fff;font-size:13px;padding:10px 20px;border-radius:20px;white-space:nowrap;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999}
    .toast.show{opacity:1}
    /* MODIFIER SHEET */
    .mod-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:300;display:none;align-items:flex-end;justify-content:center}
    .mod-overlay.show{display:flex}
    .mod-sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;animation:slideUp 0.3s ease}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    @keyframes mspin{to{transform:rotate(360deg)}}
    .mod-loading{text-align:center;padding:26px 10px;color:var(--muted);font-size:12.5px}
    .mod-loading i{font-size:24px;display:block;margin-bottom:9px;animation:mspin 0.8s linear infinite;color:var(--rose)}
    .mod-sheet-img{width:100%;height:190px;background:linear-gradient(135deg,var(--rose-soft),var(--rose-light));background-repeat:no-repeat;background-position:center;display:flex;align-items:center;justify-content:center;font-size:72px;border-radius:24px 24px 0 0;flex-shrink:0}
    .mod-sheet-close{position:absolute;top:12px;left:12px;width:32px;height:32px;background:rgba(0,0,0,0.35);border:none;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;backdrop-filter:blur(8px);z-index:1}
    .mod-sheet-hdr{position:relative}
    .mod-sheet-body{padding:16px}
    .mod-sheet-title{font-size:16px;font-weight:700;margin-bottom:3px}
    .mod-sheet-price{font-size:13px;font-weight:700;color:var(--rose-dark);margin-bottom:14px}
    .mod-grp{margin-bottom:18px}
    .mod-grp-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .mod-grp-title{font-size:13px;font-weight:700}
    .mod-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700}
    .mbadge-req{background:#fee2e2;color:#dc2626}
    .mbadge-opt{background:#f0fdf4;color:#16a34a}
    .mod-grp-sub{font-size:11px;color:var(--muted);margin-bottom:8px}
    .mod-opt{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border:1.5px solid var(--border);border-radius:11px;margin-bottom:7px;cursor:pointer;transition:all 0.15s}
    .mod-opt.sel{border-color:var(--rose);background:var(--rose-soft)}
    .mod-opt-l{display:flex;align-items:center;gap:9px}
    .radio-c{width:19px;height:19px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s}
    .mod-opt.sel .radio-c{border-color:var(--rose);background:var(--rose)}
    .radio-d{width:7px;height:7px;border-radius:50%;background:#fff;display:none}
    .mod-opt.sel .radio-d{display:block}
    .chk-c{width:19px;height:19px;border-radius:5px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s}
    .mod-opt.sel .chk-c{border-color:var(--rose);background:var(--rose)}
    .chk-i{font-size:11px;color:#fff;display:none}
    .mod-opt.sel .chk-i{display:block}
    .mod-opt-name{font-size:12px;font-weight:600;color:var(--text)}
    .mod-opt-price{font-size:11px;color:var(--muted);font-weight:600}
    .mod-opt.sel .mod-opt-price{color:var(--rose-dark)}
    .mod-err{font-size:11px;color:#dc2626;margin-top:3px;display:none}
    .mod-err.show{display:block}
    .mod-qty-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border);margin-top:4px}
    .mod-sheet-footer{padding:0 16px 24px;background:#fff;border-top:1px solid var(--border);padding-top:12px}
    .btn-add-mod{width:100%;background:var(--rose);color:#fff;border:none;border-radius:13px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Tajawal',sans-serif;display:flex;align-items:center;justify-content:space-between}
    .btn-add-mod:active{background:var(--rose-dark)}
  </style>
<style>
/* Native-app feel: text is NOT selectable / copyable; form fields (name, phone, search, notes) stay usable */
*{-webkit-touch-callout:none}
html,body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
input,textarea,select,[contenteditable="true"]{-webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text;-webkit-touch-callout:default}
img{-webkit-user-drag:none}
</style>

// Show a photo: at once if the phone already has it, otherwise a soft fade-in over the grey (no flash)
function dsShowImg(img,url){try{if(img.getAttribute('src')!==url){img.classList.add('dsfade');img.onload=function(){img.classList.remove('dsfade');};img.src=url;if(img.complete&&img.naturalWidth)img.classList.remove('dsfade');}img.style.display='block';}catch(e){img.src=url;img.style.display='block';}}

async function enhanceModifiers(silent){

let _catRaf=0;
window.addEventListener('scroll',()=>{ if(_catRaf)return; _catRaf=requestAnimationFrame(()=>{ _catRaf=0; _catSpy(); }); },{passive:true});
function renderCatBar(){
  const groups={}, order=[];
  menuItems.forEach(it=>{ const k=it.category||''; if(!(k in groups)){groups[k]=0;order.push(k);} groups[k]++; });
  const bar=document.getElementById('cat-tabs');
  const html=order.map((c,i)=>{ const x=dsCatIcon(c);
    return `<div class="cat-tab${i===0?' act':''}" onclick="setCategory(${i},this)" role="button" aria-label="${escAttr(dsCatName(c))}"><div class="cat-ic ci${x.bg}">${x.ic}</div><div class="cat-nm">${escAttr(dsCatName(c))}</div><div class="cat-k">${dsCatCount(groups[c])}</div></div>`; }).join('');
  if(bar.innerHTML!==html)bar.innerHTML=html;
  return order;
}
function escAttr(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Tap a product image → show it large; tap anywhere to close (same as the supermarket page).
function zoomImg(el){
  if(!el||!el.src)return;
  const name=(el.alt||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let ov=document.getElementById('img-zoom-ov'); if(ov)ov.remove();
  ov=document.createElement('div'); ov.id='img-zoom-ov';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;cursor:zoom-out';
  ov.innerHTML=(name?'<div style="color:#fff;font-size:16px;font-weight:800;margin-bottom:14px;text-align:center;direction:rtl;max-width:90%;font-family:\'Tajawal\',sans-serif">'+name+'</div>':'')
    +'<img src="'+(el.getAttribute('data-full')||el.src)+'" onerror="dsImgRetry(this)" style="max-width:92%;max-height:74vh;border-radius:16px;box-shadow:0 10px 50px rgba(0,0,0,.6);object-fit:contain;background:#fff"/>'
    +'<div style="color:#cbd5e1;font-size:12.5px;margin-top:16px;font-family:\'Tajawal\',sans-serif">اضغط في أي مكان للإغلاق ✕</div>';
  ov.onclick=function(){ov.remove();};
  document.body.appendChild(ov);
}
function priceHTML(item){
  return item._hasMods&&item._fromPrice!=null
    ?`<span class="from-lbl">من</span> ${RIYAL} ${fmtP(item._fromPrice)}`
    :(item.discount_price?`<span style="text-decoration:line-through;color:var(--muted);font-size:12px;margin-left:4px">${RIYAL} ${item.price}</span>${RIYAL} ${item.discount_price}`:`${RIYAL} ${item.price}`);
}
function addActFor(item){ return item._hasMods===false?`changeQty('${item.id}',1)`:`openModifierSheet('${item.id}')`; }
// Patch ONLY the price / chip / + button in place once options load → never rebuilds the images (no image flash)
function applyMods(){
  menuItems.forEach(item=>{
    const el=document.getElementById('item-'+item.id);
    if(!el)return;
    const pe=el.querySelector('.item-price'); if(pe)pe.innerHTML=priceHTML(item);
    const top=el.querySelector('.menu-item-info>div'); const chip=el.querySelector('.cust-chip');
    if(item._hasMods&&!chip&&top)top.insertAdjacentHTML('beforeend','<span class="cust-chip">🎛️ قابل للتخصيص</span>');
    else if(!item._hasMods&&chip)chip.remove();
    const act=addActFor(item);
    const ab=el.querySelector('.add-btn'); if(ab)ab.setAttribute('onclick',act);
    const qp=el.querySelector('.qty-p'); if(qp)qp.setAttribute('onclick',act);
  });
}
function renderMenu(){
  if(!menuItems.length){
    document.getElementById('menu-content').innerHTML='<div style="text-align:center;padding:3rem;color:var(--muted)"><i class="ti ti-tools-kitchen-2" style="font-size:48px;opacity:0.3;display:block;margin-bottom:1rem"></i>القائمة قريباً!</div>';
    return;
  }
  const groups={}, order=[];
  menuItems.forEach(item=>{const k=item.category||''; if(!(k in groups)){groups[k]=[];order.push(k);} groups[k].push(item);});
  document.getElementById('menu-content').innerHTML=order.map((cat,ci)=>[cat,groups[cat],ci]).map(([cat,items,ci])=>`
    <div class="menu-section" id="${dsSecId(ci)}">
      <div class="menu-sec-title"><span class="sec-ic ci${dsCatIcon(cat).bg}">${dsCatIcon(cat).ic}</span>${escAttr(dsCatName(cat))} <span class="sec-k">· ${dsCatCount(items.length)}</span></div>
      ${items.map(item=>{
        const qty=cart[item.id]?.qty||0;
        const price=item.discount_price||item.price;
        // Simple item (no options) → add instantly. Item with options → open the sheet.
        const addAct=addActFor(item);
        return `
        <div class="menu-item" id="item-${item.id}">
          ${item.image_url?`<img class="menu-item-img" src="${dsImg(item.image_url,300)}" data-full="${dsImg(item.image_url,1000)}" alt="${item.name}" loading="lazy" decoding="async" onclick="zoomImg(this)" onerror="dsImgRetry(this)||dsPh(this,'menu-item-img-fallback ds-ph')" style="cursor:zoom-in"/>`:`<div class="menu-item-img-fallback ds-ph"></div>`}
          <div class="menu-item-info">
            <div>
              <div class="item-name">${item.name}</div>
              ${item.description?`<div class="item-desc">${item.description}</div>`:''}
              ${item._hasMods?`<span class="cust-chip">🎛️ قابل للتخصيص</span>`:''}
            </div>
            <div class="item-footer">
              <div class="item-price">${priceHTML(item)}</div>
              ${item.in_stock===false
                ?`<span class="out-stock-badge">نفذت الكمية</span>`
                :`<div id="ctrl-${item.id}">${qty>0?`<div class="qty-ctrl"><button class="qty-btn qty-m" id="qm-${item.id}" onclick="changeQty('${item.id}',-1)"><i class="ti ${qty===1?'ti-trash':'ti-minus'}" style="font-size:15px"></i></button><span class="qty-n" id="qn-${item.id}">${qty}</span><button class="qty-btn qty-p" id="qp-${item.id}" onclick="${addAct}"><i class="ti ti-plus" style="font-size:15px"></i></button></div>`:`<button class="add-btn" onclick="${addAct}"><i class="ti ti-plus" style="font-size:22px"></i></button>`}</div>`
              }
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>`).join('');
}

function changeQty(itemId,delta){
  const foundItem=menuItems.find(i=>i.id===itemId);
  if(!foundItem)return;
  if(delta>0&&currentRestaurant&&!vStatus(currentRestaurant).open){showToast('🌙 المتجر مغلق حالياً');return;}
  if(delta>0){ try{var _h=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Haptics;_h?_h.impact({style:'MEDIUM'}):(navigator.vibrate&&navigator.vibrate(45));}catch(e){} }
  const price=foundItem.discount_price||foundItem.price;
  const prevQty=cart[itemId]?.qty||0;
  if(!cart[itemId])cart[itemId]={item:{...foundItem,price},qty:0};
  cart[itemId].qty=Math.max(0,cart[itemId].qty+delta);
  if(cart[itemId].qty===0)delete cart[itemId];
  updateCartBar();
  const ctrl=document.getElementById('ctrl-'+itemId);
  if(!ctrl)return;
  const qty=cart[itemId]?.qty||0;
  // FAST PATH: staying as a stepper → only change the number (instant, no DOM rebuild — like the supermarket)
  if(qty>0&&prevQty>0){
    const numEl=document.getElementById('qn-'+itemId);
    const mEl=document.getElementById('qm-'+itemId);
    if(mEl)mEl.innerHTML='<i class="ti '+(qty===1?'ti-trash':'ti-minus')+'" style="font-size:15px"></i>';
    if(numEl){numEl.textContent=qty;numEl.classList.remove('bump');void numEl.offsetWidth;numEl.classList.add('bump');
      if(delta>0)showToast('تمت الإضافة! ✓');
      return;}
  }
  // control changes shape (add ↔ stepper) → rebuild once
  if(qty>0){
    ctrl.innerHTML=`<div class="qty-ctrl"><button class="qty-btn qty-m" id="qm-${itemId}" onclick="changeQty('${itemId}',-1)"><i class="ti ${qty===1?'ti-trash':'ti-minus'}" style="font-size:15px"></i></button><span class="qty-n" id="qn-${itemId}">${qty}</span><button class="qty-btn qty-p" id="qp-${itemId}" onclick="changeQty('${itemId}',1)"><i class="ti ti-plus" style="font-size:15px"></i></button></div>`;
    const _p=document.getElementById('qp-'+itemId);
    if(_p){_p.classList.remove('bounce');void _p.offsetWidth;_p.classList.add('bounce');}
  } else {
    ctrl.innerHTML=`<button class="add-btn" onclick="changeQty('${itemId}',1)"><i class="ti ti-plus" style="font-size:22px"></i></button>`;
  }
  if(delta>0)showToast('تمت الإضافة! ✓');
}

function updateCartBar(){
  const items=Object.values(cart);
  const count=items.reduce((s,i)=>s+i.qty,0);
  const total=items.reduce((s,i)=>s+(i.item.price*i.qty),0);
  const bar=document.getElementById('cart-bar');
  document.getElementById('header-cart-count').textContent=count||'٠';
  if(count>0){
    bar.classList.add('show');
    document.getElementById('cart-count-pill').innerHTML=CART_ICON+count;
    document.getElementById('cart-bar-total').innerHTML=RIYAL+' '+fmtP(total);
    updateDeliveryDiscount(total);
  } else {
    bar.classList.remove('show');
  }
}

// Another vendor already in the cart? → flat two-vendor fee applies, no discount tier
function _menuOtherVendor(){
  try{
    const ex=JSON.parse(localStorage.getItem('qibah_cart')||'[]');
    const rn=currentRestaurant?currentRestaurant.name:'';
    return ex.some(i=>(i.vendor||i.restaurant||'السوبرماركت')!==rn);
  }catch(e){ return false; }
}

// Cheaper-delivery progress bar for this restaurant/coffee
function updateDeliveryDiscount(total){
  const row=document.getElementById('fd-row'), fill=document.getElementById('fd-fill'), text=document.getElementById('fd-text');
  if(!row||!fill||!text) return;
  if(_menuOtherVendor()){ // two vendors → flat fee, tiers don't apply
    row.style.display=''; fill.classList.remove('done'); fill.style.width='100%';
    text.innerHTML='🛍️ توصيل '+_twoVendorFee+' ريال لطلبك من متجرين';
    return;
  }
  const r=currentRestaurant||{};
  const min=Number(r.delivery_discount_min)||0, dfee=Number(r.delivery_discount_fee)||0, normal=Number(r.delivery_fee)||0;
  if(!(min>0 && dfee<normal)){ row.style.display='none'; return; } // feature off / not cheaper
  row.style.display='';
  fill.style.width=Math.max(0,Math.min(100,(total/min)*100))+'%';
  if(total>=min){
    fill.classList.add('done');
    text.innerHTML='🎉 توصيلك الآن <span class="new-fee">'+dfee+' ريال</span> <span class="old-fee">'+normal+' ريال</span>';
  }else{
    fill.classList.remove('done');
    text.innerHTML='🚚 أضف <b>'+(min-total).toFixed(2)+' ريال</b> ويصير التوصيل <span class="new-fee">'+dfee+' ريال</span> <span class="old-fee">'+normal+' ريال</span>';
  }
}

function openCartModal(){
  const items=Object.values(cart);
  if(!items.length){showToast('أضف منتجات أولاً!');return;}
  const total=items.reduce((s,i)=>s+(i.item.price*i.qty),0);
  const r=currentRestaurant;
  document.getElementById('modal-rest-name').textContent=r.name;
  document.getElementById('modal-items').innerHTML=items.map(i=>`
    <div class="modal-item">
      <div><div style="font-size:13px;font-weight:700">${i.item.name}</div>${i.modifiers&&i.modifiers.length?`<div style="font-size:10px;color:var(--muted)">${i.modifiers.join(' · ')}</div>`:''}<div style="font-size:10px;color:var(--muted)">× ${i.qty}</div></div>
      <div style="font-size:13px;font-weight:700;color:var(--rose-dark)">${RIYAL} ${fmtP(i.item.price*i.qty)}</div>
    </div>`).join('');
  document.getElementById('modal-total').innerHTML=RIYAL+' '+total.toFixed(2);
  document.getElementById('cart-modal').classList.add('show');
}

function closeCartModal(){document.getElementById('cart-modal').classList.remove('show');}

function proceedToCheckout(){
  const items=Object.values(cart);
  if(!items.length)return;
  if(currentRestaurant&&!vStatus(currentRestaurant).open){showToast('🌙 المتجر مغلق حالياً، لا يمكن الطلب الآن');return;}
  const r=currentRestaurant;
  // ── Two-vendor cart: keep items from OTHER vendors, replace this restaurant's items ──
  const existing=JSON.parse(localStorage.getItem('qibah_cart')||'[]');
  const vendorOf=i=>i.vendor||i.restaurant||'السوبرماركت';
  const others=existing.filter(i=>vendorOf(i)!==r.name);
  const otherVendors=[...new Set(others.map(vendorOf))];
  if(otherVendors.length>=2){
    showToast('🛍️ يمكنك الطلب من متجرين فقط في نفس السلة');
    return;
  }
  const cartData=items.map(i=>({id:i.item.id,name:i.item.name,price:i.item.price,qty:i.qty,image:i.item.image_url||'',modifiers:i.modifiers||[],restaurant:r.name,restaurant_wa:r.whatsapp,vendor:r.name,vendor_wa:r.whatsapp||'',vendor_fee:Number(r.delivery_fee)||0}));
  const merged=[...others,...cartData];
  localStorage.setItem('qibah_cart',JSON.stringify(merged));
  const distinct=[...new Set(merged.map(vendorOf))];
  if(distinct.length===1){
    // Single vendor (this restaurant) — keep the classic context + its own fee
    localStorage.setItem('qibah_restaurant',JSON.stringify({id:r.id,name:r.name,name_ar:r.name_ar||'',whatsapp:r.whatsapp,delivery_fee:Number(r.delivery_fee)||0}));
    localStorage.setItem('qibah_delivery_fee',String(Number(r.delivery_fee)||0));
    // cheaper-delivery tier for checkout (only when it's actually cheaper)
    const _dm=Number(r.delivery_discount_min)||0,_df=Number(r.delivery_discount_fee)||0;
    if(_dm>0 && _df<(Number(r.delivery_fee)||0)) localStorage.setItem('qibah_delivery_disc',JSON.stringify({min:_dm,fee:_df}));
    else localStorage.removeItem('qibah_delivery_disc');
  }else{
    // Two vendors — the flat two-vendor fee rule applies (computed in cart/checkout)
    localStorage.removeItem('qibah_restaurant');
    localStorage.removeItem('qibah_delivery_fee');
    localStorage.removeItem('qibah_delivery_disc');
  }
  closeCartModal();
  window.location.href='/pages/checkout.html';
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

// ── MODIFIER SHEET ──────────────────────────────
let modItem=null,modGroups=[],modSelections={},modQty=1;

async function openModifierSheet(itemId){
  const foundItem=menuItems.find(i=>i.id===itemId);
  if(!foundItem)return;
  if(foundItem._hasMods===false){ changeQty(itemId,1); return; }   // known: no options → add instantly
  // ── OPEN THE SHEET IMMEDIATELY — no waiting on the network, so the user never double-taps ──
  modItem=foundItem; modGroups=[]; modSelections={}; modQty=1;
  const basePrice=foundItem.discount_price||foundItem.price;
  document.getElementById('mod-sheet-title').textContent=foundItem.name;
  document.getElementById('mod-sheet-base-price').innerHTML=RIYAL+' '+basePrice;
  document.getElementById('mod-sheet-total').innerHTML=RIYAL+' '+basePrice;
  document.getElementById('mod-sheet-qty').textContent='1';
  // image — show the FULL image (contain), not cropped
  const imgEl=document.getElementById('mod-sheet-img');
  imgEl.textContent='';
  if(foundItem.image_url){
    imgEl.classList.remove('ds-ph');
    var _u=dsImg(foundItem.image_url,800);   // Shopify photo → phone-sized copy
    imgEl.style.backgroundImage='url("'+String(_u).replace(/["\\]/g,'')+'")';
    imgEl.style.backgroundSize='contain';
    imgEl.style.backgroundColor='#f4f4f5';
    var _t=new Image(); _t.onerror=function(){ if(modItem!==foundItem)return; if(_u!==foundItem.image_url){ _u=foundItem.image_url; imgEl.style.backgroundImage='url("'+String(_u).replace(/["\\]/g,'')+'")'; _t.src=_u; return; } imgEl.style.backgroundImage=''; imgEl.classList.add('ds-ph'); }; _t.src=_u;   // small copy fails → original; broken link → our logo
  }else{
    imgEl.style.backgroundImage=''; imgEl.style.backgroundColor=''; imgEl.classList.add('ds-ph');
  }
  document.getElementById('mod-overlay').classList.add('show');
  document.body.style.overflow='hidden';
  // ── Fill the options: from the preloaded cache (instant), else fetch now with a small loader ──
  let groups=foundItem._modGroupsFull;
  if(!groups){
    document.getElementById('mod-sheet-groups').innerHTML='<div class="mod-loading"><i class="ti ti-loader-2"></i>جاري تحميل الخيارات…</div>';
    try{
      const{data:g}=await sb.from('modifier_groups').select('*').eq('menu_item_id',itemId).order('sort_order');
      groups=g||[];
      if(groups.length){
        const gids=groups.map(x=>x.id);
        const{data:opts}=await sb.from('modifier_options').select('*').in('group_id',gids).order('sort_order');
        const byG={}; (opts||[]).forEach(o=>{(byG[o.group_id]=byG[o.group_id]||[]).push(o);});
        groups.forEach(x=>{ x.options=byG[x.id]||[]; });
      }
      foundItem._modGroupsFull=groups; foundItem._hasMods=groups.length>0;
    }catch(e){ groups=[]; }
    if(modItem!==foundItem) return;    // sheet was closed / another item opened while loading
  }
  if(!groups.length){ closeModSheet(); changeQty(itemId,1); return; }  // no options after all → add directly
  modGroups=groups;
  renderModGroups();
  updateModTotal();
}

function renderModGroups(){
  const container=document.getElementById('mod-sheet-groups');
  container.innerHTML=modGroups.map(g=>`
    <div class="mod-grp" id="modgrp-${g.id}">
      <div class="mod-grp-hdr">
        <div class="mod-grp-title">${g.name}</div>
        <span class="mod-badge ${g.required?'mbadge-req':'mbadge-opt'}">${g.required?'مطلوب':'اختياري'}</span>
      </div>
      <div class="mod-grp-sub">${g.type==='radio'?'اختر واحداً':'يمكنك اختيار أكثر من واحد'}</div>
      <div class="mod-err" id="moderr-${g.id}">يرجى اختيار ${g.name}</div>
      ${g.options.map(o=>`
        <div class="mod-opt" id="modopt-${o.id}" onclick="selectModOpt('${g.id}','${o.id}','${g.type}')">
          <div class="mod-opt-l">
            ${g.type==='radio'
              ?`<div class="radio-c"><div class="radio-d"></div></div>`
              :`<div class="chk-c"><i class="ti ti-check chk-i"></i></div>`}
            <div class="mod-opt-name">${o.name}</div>
          </div>
          <div class="mod-opt-price">${Number(o.extra_price)>0?'+ '+RIYAL+' '+fmtP(o.extra_price):'مجاني'}</div>
        </div>`).join('')}
    </div>`).join('');
}

function selectModOpt(groupId,optId,type){
  const group=modGroups.find(g=>g.id===groupId);
  if(!group)return;
  if(type==='radio'){
    group.options.forEach(o=>document.getElementById('modopt-'+o.id)?.classList.remove('sel'));
    document.getElementById('modopt-'+optId)?.classList.add('sel');
    modSelections[groupId]=[optId];
  } else {
    if(!modSelections[groupId])modSelections[groupId]=[];
    const el=document.getElementById('modopt-'+optId);
    if(modSelections[groupId].includes(optId)){
      modSelections[groupId]=modSelections[groupId].filter(id=>id!==optId);
      el?.classList.remove('sel');
    } else {
      modSelections[groupId].push(optId);
      el?.classList.add('sel');
    }
  }
  document.getElementById('moderr-'+groupId)?.classList.remove('show');
  updateModTotal();
}

function calcModExtra(){
  let extra=0;
  Object.entries(modSelections).forEach(([gId,optIds])=>{
    const g=modGroups.find(g=>g.id===gId);
    if(!g)return;
    optIds.forEach(oId=>{
      const o=g.options.find(o=>o.id===oId);
      if(o)extra+=Number(o.extra_price)||0;
    });
  });
  return extra;
}

function updateModTotal(){
  if(!modItem)return;
  const base=Number(modItem.discount_price||modItem.price);
  const total=(base+calcModExtra())*modQty;
  document.getElementById('mod-sheet-total').innerHTML=RIYAL+' '+fmtP(total);
}

function changeModQty(delta){
  modQty=Math.max(1,modQty+delta);
  document.getElementById('mod-sheet-qty').textContent=modQty;
  updateModTotal();
}

function addToCartFromSheet(){
  if(currentRestaurant&&!vStatus(currentRestaurant).open){showToast('🌙 المتجر مغلق حالياً');return;}
  // validate required groups
  let valid=true;
  modGroups.forEach(g=>{
    if(g.required&&(!modSelections[g.id]||!modSelections[g.id].length)){
      document.getElementById('moderr-'+g.id)?.classList.add('show');
      document.getElementById('modgrp-'+g.id)?.scrollIntoView({behavior:'smooth',block:'center'});
      valid=false;
    }
  });
  if(!valid)return;
  try{var _h=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Haptics;_h?_h.impact({style:'MEDIUM'}):(navigator.vibrate&&navigator.vibrate(45));}catch(e){}
  const base=Number(modItem.discount_price||modItem.price);
  const extra=calcModExtra();
  const finalPrice=base+extra;
  // build modifier label for cart display
  const modLabels=[];
  Object.entries(modSelections).forEach(([gId,optIds])=>{
    const g=modGroups.find(g=>g.id===gId);
    if(!g)return;
    optIds.forEach(oId=>{
      const o=g.options.find(o=>o.id===oId);
      if(o)modLabels.push(g.name+': '+o.name);
    });
  });
  const cartKey=modItem.id+'_'+Date.now();
  cart[cartKey]={item:{...modItem,price:finalPrice},qty:modQty,modifiers:modLabels};
  updateCartBar();
  closeModSheet();
  showToast('تمت الإضافة! ✓');
}

function closeModSheet(){
  document.getElementById('mod-overlay').classList.remove('show');
  document.body.style.overflow='';
}

function modOverlayClick(e){
  if(e.target===document.getElementById('mod-overlay'))closeModSheet();
}
</script>
