  DATA=d;

  document.getElementById('sub').textContent='توصيل لباب بيتك · '+ar(d.total||0)+' منتج';
  // hero
  const h=heroNow(), ci=(coll[COLL.find(c=>c.k===h.k).n]||{}).img||[];
  const hero=document.getElementById('hero');
  hero.className='hero h-'+h.k; hero.href='/category/'+h.k;
  hero.innerHTML='<div class="t"><span class="tag">'+h.tag+'</span><h2>'+h.t+'</h2><p>'+h.d+'</p><span class="go">'+h.go+'</span></div><div class="pics">'+
    [0,1,2,3].map(i=>'<span>'+(ci[i]?'<img src="'+esc(dsImg(ci[i],160))+'" alt="" loading="lazy" onerror="this.replaceWith(\''+h.e[i]+'\')"/>':h.e[i])+'</span>').join('')+'</div>';
  // collections
  document.getElementById('occ').innerHTML=COLL.map(c=>{ const n=(coll[c.n]||{}).c||0;
    return '<a class="oc c-'+c.k+'" href="/category/'+c.k+'"><div class="e">'+c.e+'</div><div><b>'+c.n+'</b><small>'+(n?ar(n)+' منتج':c.d)+'</small></div></a>'; }).join('');
  // most ordered
  const top=d.top||[];
  document.getElementById('top-wrap').style.display=top.length?'':'none';
  document.getElementById('top').innerHTML=top.map((p,i)=>
    '<div class="pc" data-id="'+esc(p.id)+'">'+(i<3?'<span class="rank">#'+(i+1)+'</span>':'')+
    '<div class="im">'+(p.image_url?'<img src="'+esc(dsImg(p.image_url,300))+'" alt="'+esc(p.name)+'" loading="lazy"/>':'<i class="ti ti-shopping-bag" style="font-size:36px;color:#e5d5dc"></i>')+'</div>'+
    '<div class="n">'+esc(p.name)+'</div><div class="pr"><span class="p">'+RIYAL+' '+Number(p.price).toFixed(2)+'</span><span id="ctrl-'+esc(p.id)+'"></span></div></div>').join('');
  top.forEach(p=>updateCtrl(p.id));
  // all sections, every sub-section visible
  const aisles=cats.filter(c=>!c.p);
  document.getElementById('acount').textContent=ar(aisles.length)+' قسم';
  document.getElementById('aisles').innerHTML=aisles.map(a=>{
    const subs=cats.filter(c=>c.p===a.n), total=subs.length?subs.reduce((s,c)=>s+(c.c||0),0):(a.c||0);
    return '<div class="al"><a class="ah" href="'+catUrl(a)+'" onclick="goCat(\''+esc(a.n)+'\',\''+esc(a.s||'')+'\')"><span class="c" style="background:'+esc(a.b||'#fdf2f8')+'">'+
      (a.i?'<img src="'+esc(dsImg(a.i,160))+'" alt="" loading="lazy"/>':'🛒')+'</span><span class="x"><b>'+esc(a.n)+'</b><small>'+ar(total)+' منتج'+(subs.length?' · '+ar(subs.length)+' قسم فرعي':'')+'</small></span><i class="ti ti-chevron-left"></i></a>'+
      (subs.length?'<div class="as">'+subs.map(s=>'<a href="'+catUrl(s)+'" onclick="goCat(\''+esc(s.n)+'\',\''+esc(s.s||'')+'\')">'+esc(s.n)+'</a>').join('')+'</div>':'')+'</div>';
  }).join('');
}

/* ── data: shown instantly from this phone's copy, then refreshed ── */
const CK='ds_sm_home_v1';
async function load(){
  let had=false;
  try{ const c=JSON.parse(localStorage.getItem(CK)||'null'); if(c&&c.d&&c.d.cats){ render(c.d); had=true; } }catch(e){}
  if(!sb) return;
  try{
    const r=await sb.rpc('sm_home');
    if(r&&!r.error&&r.data&&r.data.cats){
      const s=JSON.stringify(r.data);
      let old=''; try{ old=JSON.stringify((JSON.parse(localStorage.getItem(CK)||'null')||{}).d); }catch(e){}
      try{ localStorage.setItem(CK,JSON.stringify({t:Date.now(),d:r.data})); }catch(e){}
      if(!had||s!==old) render(r.data);
    }else if(!had) failMsg();
  }catch(e){ if(!had) failMsg(); }
}
function failMsg(){ document.getElementById('aisles').innerHTML='<div class="al" style="text-align:center;color:#6b7280;font-weight:700;padding:18px">تعذر التحميل — تأكد من الإنترنت <button onclick="load()" style="margin-top:8px;display:block;margin-inline:auto;background:#be185d;color:#fff;border:none;border-radius:10px;padding:7px 14px;font-weight:800">حاول مرة ثانية</button></div>'; }

/* ── delivery offer line (Admin → Settings) ── */
let _fdMin=0, _smFee0=5, _smDiscMin=0, _smDiscFee=0, _twoVendorFee=7;
async function loadDeliverySettings(){
  try{
    const r=await sb.from('settings').select('key,value').in('key',['supermarket_free_delivery_min','two_vendor_delivery_fee','supermarket_delivery_fee','supermarket_discount_min','supermarket_discount_fee']);
    (r.data||[]).forEach(s=>{ const v=Number(s.value); if(String(s.value==null?'':s.value).trim()===''||isNaN(v)||v<0)return;
      if(s.key==='supermarket_free_delivery_min')_fdMin=v; else if(s.key==='two_vendor_delivery_fee'){ if(v>0)_twoVendorFee=v; }
      else if(s.key==='supermarket_delivery_fee')_smFee0=v; else if(s.key==='supermarket_discount_min')_smDiscMin=v; else if(s.key==='supermarket_discount_fee')_smDiscFee=v; });
    const tier=_smDiscMin>0&&_smDiscFee<_smFee0&&!(_fdMin>0&&_smDiscMin>=_fdMin), parts=[];
    if(tier) parts.push('توصيل '+_smDiscFee+' ريال فوق '+_smDiscMin);
    if(_fdMin>0) parts.push('مجاني فوق '+_fdMin+' ريال');
    document.getElementById('dl').textContent=parts.length?'🚚 '+parts.join(' · '):'';
    updateCartBar();
  }catch(e){}
}

/* ── cart: same format as the category page (cart + checkout work unchanged) ── */
const _SM_VENDOR='السوبرماركت';
let cart={};
function _vendorOf(i){ return i.vendor||i.restaurant||_SM_VENDOR; }
function _saved(){ try{ const c=JSON.parse(localStorage.getItem('qibah_cart')||'[]'); return Array.isArray(c)?c:[]; }catch(e){ return []; } }
function _smBlockedByTwoVendors(){ return [...new Set(_saved().filter(i=>_vendorOf(i)!==_SM_VENDOR).map(_vendorOf))].length>=2; }
function _smOtherVendor(){ return _saved().some(i=>_vendorOf(i)!==_SM_VENDOR); }
function loadCartFromStorage(){ cart={}; _saved().filter(i=>_vendorOf(i)===_SM_VENDOR).forEach(i=>{ cart[i.id]={item:i,qty:i.qty}; }); updateCartBar(); }
function saveCartToStorage(){
  const own=Object.values(cart).map(c=>({id:c.item.id,name:c.item.name,price:c.item.price,qty:c.qty,image:c.item.image_url||c.item.image||'',vendor:_SM_VENDOR,vendor_wa:'',vendor_fee:null}));
  const others=_saved().filter(i=>_vendorOf(i)!==_SM_VENDOR);
  localStorage.setItem('qibah_cart',JSON.stringify([...others,...own]));
  if(!others.length){ localStorage.removeItem('qibah_restaurant'); localStorage.removeItem('qibah_delivery_fee'); }
}
function changeQty(id,delta,e){
  if(e) e.stopPropagation();
  if(delta>0&&_smBlockedByTwoVendors()){ showToast('🛍️ يمكنك الطلب من متجرين فقط في نفس السلة'); return; }
  const prod=(DATA&&DATA.top||[]).find(p=>String(p.id)===String(id))||(cart[id]&&cart[id].item); if(!prod) return;
  const key=prod.id, prev=cart[key]?cart[key].qty:0;
  if(!cart[key]) cart[key]={item:prod,qty:0};
  cart[key].qty=Math.max(0,cart[key].qty+delta); if(!cart[key].qty) delete cart[key];
  saveCartToStorage(); updateCartBar(); updateCtrl(key);
  if(delta>0){
    try{ const hp=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Haptics; hp?hp.impact({style:'MEDIUM'}):(navigator.vibrate&&navigator.vibrate(45)); }catch(_){}
    if(prev>0){ const n=document.getElementById('qn-'+key); if(n){ n.classList.remove('bump'); void n.offsetWidth; n.classList.add('bump'); } }
    const b=document.getElementById('cart-count'); if(b){ b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
    showToast('تمت الإضافة ✓');
  }
}
function updateCtrl(id){
  const el=document.getElementById('ctrl-'+id); if(!el) return;
  const q=cart[id]?cart[id].qty:0;
  el.innerHTML=q>0
    ?'<span class="qty-ctrl"><button class="qty-btn qty-m" onclick="changeQty(\''+id+'\',-1,event)" aria-label="أنقص"><i class="ti ti-minus" style="font-size:12px"></i></button><span class="qty-n" id="qn-'+id+'">'+q+'</span><button class="qty-btn qty-p" onclick="changeQty(\''+id+'\',1,event)" aria-label="زد"><i class="ti ti-plus" style="font-size:12px"></i></button></span>'
    :'<button class="add-btn" onclick="changeQty(\''+id+'\',1,event)" aria-label="أضف"><i class="ti ti-plus" style="font-size:18px"></i></button>';
}
function updateCartBar(){
  const items=Object.values(cart), count=items.reduce((s,i)=>s+i.qty,0), total=items.reduce((s,i)=>s+Number(i.item.price)*i.qty,0);
  const all=_saved().reduce((s,i)=>s+(Number(i.qty)||0),0);
  document.getElementById('cart-count').textContent=all?ar(all):'٠';
  const bar=document.getElementById('cart-bar');
  if(count>0){ bar.classList.add('show'); document.getElementById('cart-count-pill').innerHTML=CART_ICON+count; document.getElementById('cart-total').innerHTML=RIYAL.replace('currentColor','#fff')+' '+total.toFixed(2); updateFreeDelivery(total); }
  else bar.classList.remove('show');
}
function updateFreeDelivery(total){
  const fill = document.getElementById('fd-fill');
  const text = document.getElementById('fd-text');
  if(!fill || !text) return;
  const R = RIYAL.replace('currentColor','#fff');
  if(_smOtherVendor()){ // restaurant item also in cart → flat two-vendor fee
    fill.classList.remove('done'); fill.style.width = '100%';
    text.innerHTML = '🛍️ توصيل ' + _twoVendorFee + ' ' + R + ' لطلبك من متجرين';
    return;
  }
  // cheaper-delivery tier first ("أضف X ويصير التوصيل 3.5 بدل 5"), then free delivery
  const tier = _smDiscMin>0 && _smDiscFee<_smFee0 && !(_fdMin>0 && _smDiscMin>=_fdMin);
  const nf = x => '<span class="new-fee">'+x+' '+R+'</span> <span class="old-fee">'+_smFee0+'</span>';
  if(tier && total < _smDiscMin){
    fill.classList.remove('done'); fill.style.width = Math.max(0, Math.min(100, (total/_smDiscMin)*100)) + '%';
    text.innerHTML = '🚚 أضف <b>' + (_smDiscMin-total).toFixed(2) + ' ' + R + '</b> ويصير التوصيل ' + nf(_smDiscFee);
    return;
  }
  if(!(_fdMin > 0)){   // no free delivery: show the fee the customer pays now
    fill.style.width = '100%';
    if(tier){ fill.classList.add('done'); text.innerHTML = '🎉 توصيلك الآن ' + nf(_smDiscFee); }
    else { fill.classList.remove('done'); text.innerHTML = '🚚 التوصيل <b>' + _smFee0 + ' ' + R + '</b>'; }
    return;
  }
  const min = _fdMin;
  const pct = Math.max(0, Math.min(100, (total/min)*100));
  fill.style.width = pct + '%';
  if(tier && total < min){
    fill.classList.remove('done');
    text.innerHTML = '✅ توصيلك ' + nf(_smDiscFee) + ' · أضف <b>' + (min-total).toFixed(2) + ' ' + R + '</b> لتوصيل مجاني';
    return;
  }
  if(total >= min){
    fill.classList.add('done');
    text.innerHTML = '🎉 مبروك! حصلت على <b>توصيل مجاني</b>';
  } else {
    fill.classList.remove('done');
    const remain = (min - total).toFixed(2);
    text.innerHTML = (pct >= 75)
      ? ('🔥 باقي <b>' + remain + ' ' + R + '</b> فقط للتوصيل المجاني!')
      : ('🚚 أضف <b>' + remain + ' ' + R + '</b> لتوصيل مجاني');
  }
}
function showToast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1500); }
// the big search (or another tab) changed the cart → refresh
window.updateCart=function(){ loadCartFromStorage(); (DATA&&DATA.top||[]).forEach(p=>updateCtrl(p.id)); };
addEventListener('pageshow',()=>window.updateCart());
addEventListener('storage',e=>{ if(e.key==='qibah_cart') window.updateCart(); });

document.addEventListener('DOMContentLoaded',()=>{
  loadCartFromStorage();
  if(typeof supabase!=='undefined'){ sb=supabase.createClient(SB_URL,SB_KEY); loadDeliverySettings(); }
  load();
});
</script>
