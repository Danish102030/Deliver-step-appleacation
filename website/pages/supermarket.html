function renderCats(list) {
  if (SUB) return;   // a section's sub-categories are on screen — keep them
  const grid = document.getElementById('cats-grid');
  document.getElementById('cat-count').textContent = list.length + ' فئة';   // English digits
  // Skip re-render if the grid already shows the same categories → no flicker
  const sig = JSON.stringify(list.map(c => [c.name, c.image_url, c.bg_color]));
  if (grid.dataset.sig === sig) return;
  grid.dataset.sig = sig;
  grid.innerHTML = list.map(c => `
    <div class="cat-card" onclick="goToCategory('${c.name}')">
      <div class="cat-img-wrap" style="background:${c.bg_color||'#f0fdf4'}">
        ${c.image_url
          ? `<img src="${c.image_url}" alt="${c.name}" loading="lazy"/>`
          : `<div style="font-size:40px">🛒</div>`}
      </div>
      <div class="cat-name">${c.name}</div>
    </div>`).join('');
}

// Sections with sub-categories open on this page; each one is a step in the phone's history,
// so the back button / back swipe returns to the main list instead of leaving the supermarket.
let SUB = null;
window.addEventListener('popstate', e => { const s = e.state && e.state.dsSub; if (s) goToCategory(s, true); else if (SUB) showMain(); });
function resetToMain() {
  if (SUB && history.state && history.state.dsSub) { history.back(); return; }
  showMain();
}
function showMain() {
  SUB = null;
  document.getElementById('home-btn').style.display = '';
  document.getElementById('page-heading').textContent = 'سوبرماركت 🛒';
  document.getElementById('page-sub').style.display = '';
  document.body.classList.remove('in-sub');
  document.getElementById('back-btn').style.display = 'none';
  renderCats(allCats);
}

function filterCats(q) {
  const filtered = q ? allCats.filter(c => c.name.includes(q)) : allCats;
  renderCats(filtered);
}

// Clean category address (Ninja style): /category/fruits-vegetables — old ?cat= address if a category has no slug yet
function catUrl(name, slug){ return slug ? '/category/' + slug : '/marketproducts?cat=' + encodeURIComponent(name); }
function goCat(name, slug){ try{ sessionStorage.setItem('qibah_cat', name); sessionStorage.setItem('qibah_cat_slug', slug||''); }catch(_){} window.location.href = catUrl(name, slug); }
async function goToCategory(name, fromHistory) {
  const _main = (allCats||[]).find(c => c.name === name) || {};
  try {
    const {data} = await sb.from('supermarket_categories')
      .select('id, name, image_url, bg_color, slug')
      .eq('parent_name', name)
      .eq('is_active', true)
      .order('sort_order');

    if (data && data.length > 0) {
      showSubCategories(name, data, fromHistory);
    } else {
      goCat(name, _main.slug);
    }
  } catch(e) {
    goCat(name, _main.slug);
  }
}

function showSubCategories(parentName, subs, fromHistory) {
  if (!fromHistory) { try { history.pushState({ dsSub: parentName }, ''); } catch(_) {} }
  SUB = parentName;
  document.getElementById('home-btn').style.display = 'none';   // one back arrow only: back to the sections
  document.getElementById('page-heading').textContent = parentName;
  document.getElementById('page-sub').style.display = 'none';
  document.body.classList.add('in-sub');
  document.getElementById('back-btn').style.display = 'flex';
  document.getElementById('cat-count').textContent = subs.length + ' فئة';

  const grid = document.getElementById('cats-grid');
  grid.dataset.sig = 'subcats:' + parentName; // so returning to main re-renders
  grid.innerHTML = subs.map(c => `
    <div class="cat-card" data-name="${c.name}" data-slug="${c.slug||''}" onclick="goCat(this.dataset.name,this.dataset.slug)">
      <div class="cat-img-wrap" style="background:${c.bg_color||'#f0fdf4'}">
        ${c.image_url
          ? `<img src="${c.image_url}" alt="${c.name}" loading="lazy"/>`
          : `<div style="font-size:40px">🛒</div>`}
      </div>
      <div class="cat-name">${c.name}</div>
    </div>`).join('');
}

function updateCart() {
  const cart = JSON.parse(localStorage.getItem('qibah_cart') || '[]');
  document.getElementById('cart-count').textContent = cart.reduce((s,i) => s+i.qty, 0) || '٠';
}

async function loadDeliverySettings(){
  if(!sb)return;
  try{
    const{data}=await sb.from('settings').select('key,value').in('key',['supermarket_delivery_fee','supermarket_free_delivery_min','supermarket_discount_min','supermarket_discount_fee']);
    if(!data)return;
    let fee=null, minFree=null, dMin=0, dFee=null;
    data.forEach(s=>{
      if(s.key==='supermarket_delivery_fee')fee=Number(s.value);
      if(s.key==='supermarket_free_delivery_min')minFree=Number(s.value);
      if(s.key==='supermarket_discount_min')dMin=Number(s.value)||0;
      if(s.key==='supermarket_discount_fee')dFee=Number(s.value);
    });
    // cheaper delivery from dMin (Admin → Settings) — shown with the free-delivery offer
    const tier=dMin>0&&dFee!==null&&!isNaN(dFee)&&fee!==null&&dFee<fee&&!(minFree>0&&dMin>=minFree);
    const n=x=>'<span class="n">'+x+'</span>', slides=[];
    if(minFree>0) slides.push('<div class="dslide ds-free"><span>🎉</span><span><b>توصيل مجاني</b> للطلبات فوق '+n(minFree)+' ريال</span></div>');
    if(tier) slides.push('<div class="dslide ds-tier"><span>🚚</span><span>توصيل <b class="n">'+dFee+'</b> ريال فوق '+n(dMin)+' ريال <s class="n">'+fee+'</s></span></div>');
    if(!slides.length&&fee!==null&&!isNaN(fee)) slides.push('<div class="dslide ds-tier"><span>🚚</span><span>رسوم التوصيل '+n(fee)+' ريال</span></div>');
    deliverySlider(slides);
  }catch(e){}
}
// delivery offers: swipe left/right, or they change by themselves every 4 seconds
let _dsI=0, _dsT=null;
function deliverySlider(slides){
  const el=document.getElementById('dslider'); if(!el) return;
  if(!slides.length){ el.innerHTML=''; return; }
  el.innerHTML='<div class="dtrack" id="dtrack">'+slides.join('')+'</div>'+(slides.length>1?'<div class="ddots">'+slides.map((_,i)=>'<i'+(i?'':' class="on"')+'></i>').join('')+'</div>':'');
  const n=slides.length, tr=document.getElementById('dtrack'), dots=el.querySelectorAll('.ddots i');
  const go=k=>{ _dsI=(k+n)%n; tr.style.transform='translateX('+(_dsI*100)+'%)'; dots.forEach((d,i)=>d.classList.toggle('on',i===_dsI)); };
  const auto=()=>{ clearInterval(_dsT); if(n>1) _dsT=setInterval(()=>go(_dsI+1),4000); };
  if(n>1&&!el.dataset.on){ el.dataset.on='1'; let x0=null;
    el.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; },{passive:true});
    el.addEventListener('touchend',e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>30) go(_dsI+(dx>0?1:-1)); x0=null; auto(); });
    el.addEventListener('click',()=>{ go(_dsI+1); auto(); }); }
  go(0); auto();
}

// banner that changes with the time of day → opens the products for that time (/category/<collection>)
function renderHero(){
  const h=new Date().getHours(), H=
    (h>=5&&h<11)?{k:'breakfast',tag:'☀️ صباح الخير',t:'جهّز فطورك',d:'صامولي، جبن، قشطة، لبن وشاي',go:'تسوّق الفطور ←',e:['🥖','🧀','🥛','🍯']}:
    (h>=11&&h<16)?{k:'lunch',tag:'🌤️ وقت الغداء',t:'مقاضي طبخ الغداء',d:'رز، دجاج، خضار، زيت وبهارات',go:'تسوّق الغداء ←',e:['🍚','🍗','🍅','🧂']}:
    (h>=16&&h<21)?{k:'dinner',tag:'🌇 مساء الخير',t:'عشاء خفيف وسريع',d:'توست، جبن، بيض، تونة وبرجر',go:'تسوّق العشاء ←',e:['🍞','🧀','🥚','🍔']}:
                  {k:'cold',tag:'🌙 سهرة الليلة',t:'آيسكريم ومشروبات باردة',d:'آيسكريم، عصائر، مشروبات وشيبس',go:'تسوّق الآن ←',e:['🍦','🥤','🧃','🍿']};
  const el=document.getElementById('hero'); if(!el) return;
  el.className='hero h-'+H.k; el.href='/category/'+H.k;
  el.innerHTML='<div class="t"><span class="tag">'+H.tag+'</span><h2>'+H.t+'</h2><p>'+H.d+'</p><span class="go">'+H.go+'</span></div><div class="pics">'+H.e.map(x=>'<span>'+x+'</span>').join('')+'</div>';
}

// "توصيل لباب بيتك · +1948 منتج" — the real number (English digits), grows as products are added
function showCount(n){ if(n>0){ const el=document.getElementById('page-sub'); if(el) el.innerHTML='توصيل لباب بيتك · <span class="n">+'+n+'</span> منتج'; } }
async function loadProductCount(){
  try{ const c=JSON.parse(localStorage.getItem('ds_sm_count')||'null'); if(c&&c.n) showCount(c.n); }catch(e){}
  if(!sb) return;
  try{
    const r=await sb.from('supermarket_products').select('id',{count:'exact',head:true}).or('is_active.is.null,is_active.eq.true');
    if(r&&!r.error&&r.count>0){ showCount(r.count); try{ localStorage.setItem('ds_sm_count',JSON.stringify({n:r.count,t:Date.now()})); }catch(e){} }
  }catch(e){}
}

document.addEventListener('DOMContentLoaded', () => {
  updateCart();
  renderHero();
  if(typeof supabase !== 'undefined') {
    sb = supabase.createClient(SB_URL, SB_KEY);
    // Back-navigation: render this session's cached categories INSTANTLY (smooth, no skeleton).
    // First visit: show the shimmer skeleton while we fetch.
    if (history.state && history.state.dsSub) { SUB = history.state.dsSub; goToCategory(SUB, true); }   // came back to a section
    const hadCache = renderCachedCats();
    if(!hadCache){
      const grid=document.getElementById('cats-grid');
      if(grid){
        let sk='';
        for(let i=0;i<9;i++)sk+='<div class="sktile"><div class="s-timg skel"></div><div class="s-tnm skel"></div></div>';
        grid.dataset.sig=''; grid.innerHTML=sk;
      }
    }
    loadCatsFromDB();       // refreshes silently; renderCats is a no-op if nothing changed
    loadDeliverySettings();
    loadProductCount();
  } else {
    // Fallback if Supabase fails to load
    allCats = getDefaultCats();
    renderCats(allCats);
  }
});
