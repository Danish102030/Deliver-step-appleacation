<script>
const SB_URL='https://vjuhxpttssmyomqqomdx.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqdWh4cHR0c3NteW9tcXFvbWR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5MjQxNjAsImV4cCI6MjA5NDUwMDE2MH0.JiGnmOEPPM3dka-KHIm5mEFs7GWb4Amsnp6R57r7Lro';
let sb=null;
const BUFFET_CATS=['buffet-breakfast','buffet-lunch','buffet-dinner','buffet-mixed'];
function _alsoIn(r,key){return (r.also_in||'').split(',').map(s=>s.trim()).includes(key);}
const catConfig={
  'buffet-breakfast':{icon:'🍳',label:'إفطار',bg:'linear-gradient(135deg,#0f766e,#0d9488)'},
  'buffet-lunch':   {icon:'🥘',label:'غداء',bg:'linear-gradient(135deg,#065f46,#059669)'},
  'buffet-dinner':  {icon:'🌙',label:'عشاء',bg:'linear-gradient(135deg,#1e3a5f,#1e40af)'},
  'buffet-mixed':   {icon:'✨',label:'متنوع',bg:'linear-gradient(135deg,#7c3aed,#a855f7)'},
};
let allBuffets=[],currentFilter='all',currentSearch='';
function vStatus(v){
  if(v.is_open===false)return{open:false,pill:'مغلق مؤقتاً',cls:'rc-closed'};
  if(v.is_24h)return{open:true,pill:'٢٤ ساعة',cls:'rc-open'};
  var P=function(t){var m=/(\d{1,2}):(\d{2})/.exec(t||'');return m?(+m[1]*60+ +m[2]):null;};
  var o=P(v.open_time),c=P(v.close_time);
  if(o==null||c==null)return{open:!!v.is_open,pill:v.is_open?'مفتوح':'مغلق',cls:v.is_open?'rc-open':'rc-closed'};
  var n=new Date(),nm=n.getHours()*60+n.getMinutes();
  var within=c>o?(nm>=o&&nm<c):(nm>=o||nm<c);
  if(within){var tc=(c-nm+1440)%1440;return tc<=25?{open:true,pill:'⏰ يغلق قريباً',cls:'st-soon'}:{open:true,pill:'مفتوح',cls:'rc-open'};}
  var to=(o-nm+1440)%1440;return to<=25?{open:false,pill:'🟢 يفتح قريباً',cls:'st-soonopen'}:{open:false,pill:'مغلق',cls:'rc-closed'};
}
function _vHasOffer(v){return Number(v.delivery_fee)!==0&&Number(v.delivery_discount_min)>0&&Number(v.delivery_discount_fee)<Number(v.delivery_fee);}
function vendorCard(v){
  const cfg=catConfig[v.category]||{icon:'🍽️',label:'بوفيه',bg:'linear-gradient(135deg,#0f766e,#0d9488)'};
  const isFree=Number(v.delivery_fee)===0;
  const hasOffer=v.original_delivery_fee&&Number(v.original_delivery_fee)>Number(v.delivery_fee);
  const hasDisc=!isFree&&Number(v.delivery_discount_min)>0&&Number(v.delivery_discount_fee)<Number(v.delivery_fee);
  const img=v.banner_url?`<img src="${v.banner_url}" alt="${v.name}" loading="lazy" style="width:100%;height:100%;object-fit:cover"/>`:`<div class="rc-img-bg" style="background:${cfg.bg}">${cfg.icon}</div>`;
  const ribbon=isFree?'<div class="rc-free-ribbon"><i class="ti ti-truck-delivery" style="font-size:9px"></i> مجاني</div>':'';
  let del='';
  if(isFree)del='<div class="chip chip-del-free"><i class="ti ti-truck-delivery"></i> مجاني 🎉</div>';
  else if(hasDisc)del=`<div class="chip chip-del offer"><i class="ti ti-truck-delivery"></i><span class="old">SAR ${Number(v.delivery_fee)}</span><span class="new">SAR ${Number(v.delivery_discount_fee)}</span></div>`;
  else if(hasOffer)del=`<div class="chip chip-del"><i class="ti ti-truck-delivery"></i><span style="text-decoration:line-through;color:#9ca3af;font-size:10px;font-weight:600;margin-right:2px">SAR ${v.original_delivery_fee}</span><span style="color:#16a34a;font-size:12px;font-weight:900">SAR ${v.delivery_fee}</span></div>`;
  else del=`<div class="chip chip-del"><i class="ti ti-truck-delivery"></i> SAR ${v.delivery_fee}</div>`;
  const _s=vStatus(v);
  const is24=!!v.is_24h;
  const isOpen=_s.open;
  const t=isOpen?(v.delivery_time||'30-45')+' د':'مغلق';
  const dim=isOpen?'':' rc-dim';
  const h24badge=is24?'<div style="position:absolute;top:0;left:0;background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;font-size:8px;font-weight:700;padding:3px 7px;border-radius:0 0 10px 0">24h</div>':'';
  const closedTag=!isOpen&&v.open_time?` · يفتح ${v.open_time}`:'';
  const offerBadge=hasDisc?'<div class="rc-offer-badge">🚚 عرض توصيل</div>':'';
  const rcTag=hasDisc?`<div class="offer-note">🎉 توصيل موفّر عند SAR ${Number(v.delivery_discount_min)}</div>`:`<div class="rc-tag">${cfg.icon} ${cfg.label}${v.review_count?' · '+v.review_count+' تقييم':''}${closedTag}</div>`;
  return `<div class="rc${dim}${hasDisc?' rc-offer':''}" onclick="window.location.href='/menu?id=${v.id}'">
    <div class="rc-img">${img}${ribbon}${h24badge}${offerBadge}<div class="rc-status ${_s.cls}">${_s.pill}</div><button data-fav="${v.id}" onclick="toggleFav(event,'${v.id}')" aria-label="مفضلة" style="position:absolute;bottom:6px;left:6px;width:30px;height:30px;border:none;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:6;padding:0;line-height:1">${_isFav(v.id)?'❤️':'🤍'}</button></div>
    <div class="rc-body">
      <div><div class="rc-top"><div class="rc-name">${v.name}</div><div class="rc-star"><i class="ti ti-star-filled"></i><span>${v.rating||'5.0'}</span></div></div>
      ${rcTag}</div>
      <div class="rc-chips">${del}<div class="chip chip-time"><i class="ti ti-clock"></i> ${t}</div><div class="chip chip-min"><i class="ti ti-shopping-bag"></i> SAR ${v.min_order||50}</div></div>
    </div></div>`;
}
/* ── Favorites: saved on this device; they appear in Account ▸ المفضلة ── */
function _getFavs(){try{return JSON.parse(localStorage.getItem('ds_favorites')||'[]');}catch(e){return[];}}
function _isFav(id){return _getFavs().some(function(f){return String(f.id)===String(id);});}
function _favVendorById(id){var a=[];try{a=allBuffets||[];}catch(e){}for(var i=0;i<a.length;i++){if(String(a[i].id)===String(id))return a[i];}return null;}
function toggleFav(ev,id){
  if(ev&&ev.stopPropagation)ev.stopPropagation();
  var v=(typeof _favVendorById==='function'&&_favVendorById(id))||{id:id};
  var favs=_getFavs();var idx=-1;for(var k=0;k<favs.length;k++){if(String(favs[k].id)===String(id)){idx=k;break;}}
  var on;if(idx>-1){favs.splice(idx,1);on=false;}else{favs.push({id:id,name:v.name||'',category:v.category||'',delivery_fee:Number(v.delivery_fee)||0,url:'/menu?id='+id});on=true;}
  try{localStorage.setItem('ds_favorites',JSON.stringify(favs));}catch(e){}
  var hs=document.querySelectorAll('[data-fav="'+id+'"]');for(var j=0;j<hs.length;j++){hs[j].innerHTML=on?'❤️':'🤍';}
  if(typeof showToast==='function')showToast(on?'❤️ أُضيف إلى المفضلة':'أُزيل من المفضلة');
  try{if(navigator.vibrate)navigator.vibrate(30);}catch(e){}
  return false;
}
async function loadBuffets(){
  const CK='qibah_cache_buffet';
  let _paintedSig='';
  // Instant paint from cache → no flash when coming back from a menu
  try{const c=sessionStorage.getItem(CK);if(c){allBuffets=JSON.parse(c)||[];if(allBuffets.length){renderFeatured();renderBuffets();_paintedSig=c;}}}catch(e){}
  try{
    const race=await Promise.race([
      sb.from('restaurants').select('*').order('sort_order'),
      new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),6000))
    ]);
    const{data,error}=race;
    if(error)console.error(error);
    const all=data||[];
    let list=all.filter(r=>BUFFET_CATS.includes(r.category)||_alsoIn(r,'buffet'));
    if(!list.length&&all.length) list=all;
    allBuffets=list;
    if(list.length){try{sessionStorage.setItem(CK,JSON.stringify(list));}catch(e){}}
  }catch(e){console.error('loadBuffets:',e.message);/* keep cached list on error */}
  // Only repaint if the list actually changed → no flash on the second visit
  if(JSON.stringify(allBuffets)!==_paintedSig){renderFeatured();renderBuffets();}
}
function updateCartCount(){const cart=JSON.parse(localStorage.getItem('qibah_cart')||'[]');document.getElementById('cart-count').textContent=cart.reduce((s,i)=>s+i.qty,0)||'٠';}
function renderFeatured(){
  const list=allBuffets.filter(b=>b.is_open).slice(0,4);
  if(!list.length){document.getElementById('featured-scroll').innerHTML='';return;}
  document.getElementById('featured-scroll').innerHTML=list.map(b=>{
    const cfg=catConfig[b.category]||{icon:'🍽️',label:'بوفيه',bg:'linear-gradient(135deg,#0f766e,#0d9488)'};
    return `<div class="feat-card" onclick="window.location.href='/menu?id=${b.id}'">
      <div class="feat-img">${b.banner_url?`<img src="${b.banner_url}" loading="lazy"/>`:`<div style="width:100%;height:100%;background:${cfg.bg};display:flex;align-items:center;justify-content:center;font-size:48px">${cfg.icon}</div>`}<div class="feat-overlay"></div><div class="feat-badge">مميز</div></div>
      <div class="feat-info"><div class="feat-name">${b.name}</div>
      <div class="feat-meta"><span style="color:#f59e0b;display:flex;align-items:center;gap:2px"><i class="ti ti-star-filled" style="font-size:11px"></i> ${b.rating||'5.0'}</span><span>· ${b.delivery_time||'30-45'} د</span><span style="color:#16a34a">· ${Number(b.delivery_fee)===0?'مجاني':'SAR '+b.delivery_fee}</span></div></div></div>`;
  }).join('');
}
function setFilter(f,el){currentFilter=f;document.querySelectorAll('.fpill').forEach(p=>p.classList.remove('act'));el.classList.add('act');renderBuffets();}
function filterBuffets(){currentSearch=document.getElementById('search-input').value.toLowerCase();renderBuffets();}
function renderBuffets(){
  let list=[...allBuffets];
  list.sort((a,b)=>(_vHasOffer(b)?1:0)-(_vHasOffer(a)?1:0)); // offer vendors first
  if(currentFilter!=='all')list=list.filter(b=>b.category===currentFilter);
  if(currentSearch)list=list.filter(b=>b.name.toLowerCase().includes(currentSearch)||(b.name_ar||'').includes(currentSearch));
  document.getElementById('buffet-count').textContent=list.length+' بوفيه · قبة';
  if(!list.length){document.getElementById('buffet-list').innerHTML='<div class="empty"><i class="ti ti-chef-hat"></i><p>لا توجد بوفيهات حالياً</p></div>';return;}
  document.getElementById('buffet-list').innerHTML=list.map(b=>vendorCard(b)).join('');
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
window.addEventListener('load',()=>{
  if(typeof supabase==='undefined'){
    document.getElementById('buffet-list').innerHTML='<div class="empty"><i class="ti ti-wifi-off"></i>تعذر الاتصال، أعد تحميل الصفحة</div>';
    return;
  }
  sb=supabase.createClient(SB_URL,SB_KEY);
  updateCartCount();
  loadBuffets();
});
</script>
</body>
</html>
