<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#4c1d95"/></linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="0.55" stop-color="#7c3aed"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f2937"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e5e7eb"/></linearGradient>
    <linearGradient id="plug" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9dde5"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="240" height="240" rx="56" fill="url(#bg)"/>
  <circle cx="196" cy="40" r="58" fill="#ffffff" opacity="0.08"/>
  <circle cx="34" cy="214" r="46" fill="#ffffff" opacity="0.07"/>
  <!-- cable -->
  <path d="M168 176 C 196 196, 206 150, 186 132" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
  <!-- phone -->
  <g filter="url(#sh)" transform="rotate(-10 104 116)">
    <rect x="62" y="34" width="88" height="164" rx="20" fill="url(#body)"/>
    <rect x="69" y="42" width="74" height="148" rx="15" fill="url(#scr)"/>
    <rect x="92" y="47" width="28" height="8" rx="4" fill="#0b1020"/>
    <g fill="#ffffff" opacity="0.92">
      <rect x="78" y="66" width="16" height="16" rx="5"/><rect x="98" y="66" width="16" height="16" rx="5" opacity="0.8"/><rect x="118" y="66" width="16" height="16" rx="5" opacity="0.65"/>
      <rect x="78" y="88" width="16" height="16" rx="5" opacity="0.7"/><rect x="98" y="88" width="16" height="16" rx="5"/><rect x="118" y="88" width="16" height="16" rx="5" opacity="0.85"/>
    </g>
    <path d="M102 128 l-10 20 h12 l-6 18 l18 -26 h-12 l8 -12 z" fill="#fde047"/>
    <rect x="92" y="178" width="28" height="4" rx="2" fill="#ffffff" opacity="0.7"/>
  </g>
  <!-- earbuds case -->
  <g filter="url(#sh)">
    <rect x="22" y="146" width="62" height="50" rx="22" fill="url(#case)"/>
    <path d="M24 166 h58" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="53" cy="183" r="3" fill="#22c55e"/>
    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="2">
      <ellipse cx="40" cy="146" rx="9" ry="11"/><ellipse cx="66" cy="146" rx="9" ry="11"/>
    </g>
  </g>
  <!-- charger -->
  <g filter="url(#sh)">
    <rect x="160" y="140" width="50" height="50" rx="14" fill="url(#plug)"/>
    <rect x="170" y="128" width="7" height="16" rx="2" fill="#94a3b8"/><rect x="193" y="128" width="7" height="16" rx="2" fill="#94a3b8"/>
    <path d="M188 152 l-9 15 h9 l-4 13 l13 -19 h-9 l5 -9 z" fill="#7c3aed"/>
