workflows:
  android-rider-apk:
    name: Android Rider APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - ftp
      android_signing:
        - deliverystep_keystore
      vars:
        PACKAGE_NAME: com.deliverstep.app
        APP_NAME: Delivery Step Rider
      node: 22
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Sync Capacitor
        script: |
          npx cap sync android
      - name: Verify google-services.json
        script: |
          if [ ! -f "android/app/google-services.json" ]; then
            echo "ERROR: google-services.json missing"
            exit 1
          fi
          echo "google-services.json OK"
      - name: Build signed release APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease
          echo "=== Built APKs ==="
          find . -name "*.apk" -type f
      - name: Rename APK
        script: |
          find android -name "*.apk" -type f | while read apk; do
            dir=$(dirname "$apk")
            cp "$apk" "$dir/DeliveryStepRider.apk"
          done
      - name: GET APK DOWNLOAD LINK (open this step after the build)
        script: |
          BUILD_DIR="${CM_BUILD_DIR:-$(pwd)}"
          APK=$(find "$BUILD_DIR" -name "*.apk" -type f 2>/dev/null | grep -iE 'release' | head -1)
          [ -z "$APK" ] && APK=$(find "$BUILD_DIR" -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then echo "No APK found"; exit 0; fi
          echo "APK: $APK  ($(du -h "$APK" | cut -f1))"

          # If the Hostinger FTP login is saved in Codemagic, also update the permanent website link
          if [ -n "$FTP_HOST" ] && [ -n "$FTP_USER" ] && [ -n "$FTP_PASS" ]; then
            for P in "public_html" "domains/deliverystep.app/public_html" "public_html/deliverystep.app"; do
              if curl --show-error --fail --ssl -T "$APK" "ftp://$FTP_HOST/$P/rider-app.apk" --user "$FTP_USER:$FTP_PASS" --ftp-create-dirs ; then
                echo "Website link updated: https://deliverystep.app/rider-app.apk"; break
              fi
            done
          fi

          # Always: make a no-setup public download link (works without Hostinger)
          echo "=== Creating a download link ==="
          LINK=$(curl -sS -F "reqtype=fileupload" -F "fileToUpload=@$APK" https://catbox.moe/user/api.php || true)
          case "$LINK" in
            http*) : ;;
            *) LINK=$(curl -sS -A "DeliveryStepRider/1.0" -F "file=@$APK" https://0x0.st || true) ;;
          esac
          echo ""
          echo "=================================================================="
          echo "=================================================================="
          echo ""
          echo "   DOWNLOAD THE RIDER APP ON YOUR PHONE FROM THIS LINK:"
          echo ""
          echo "        $LINK"
          echo ""
          echo "   (open that link in the phone browser -> it installs the app)"
          echo ""
          echo "=================================================================="
          echo "=================================================================="
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/mapping/**/*.txt
    publishing:
      email:
        recipients:
          - ihsanullah.danish5000@gmail.com
        notify:
          success: true
          failure: true

  ios-app-store:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      vars:
        BUNDLE_ID: com.deliverystep.app
        XCODE_PROJECT: ios/DeliveryStep.xcodeproj
        XCODE_SCHEME: DeliveryStep
    scripts:
      - name: Verify icon and Info.plist
        script: |
          ICONSET="ios/DeliveryStep/Assets.xcassets/AppIcon.appiconset"
          echo "=== AppIcon_1024.png ==="
          sips -g pixelWidth -g pixelHeight "$ICONSET/AppIcon_1024.png"
          echo "=== Contents.json ==="
          cat "$ICONSET/Contents.json"
          echo "=== CFBundleIconName in Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" ios/DeliveryStep/Info.plist
      - name: Set up keychain
        script: keychain initialize
      - name: Create certificate and provisioning profile
        script: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out /tmp/dist_key.pem
          CERT_OUTPUT=$(app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key @file:/tmp/dist_key.pem \
            --save 2>&1)
          echo "$CERT_OUTPUT"
          CERT_ID=$(echo "$CERT_OUTPUT" | grep "^Id:" | awk '{print $2}')
          echo "Certificate ID: $CERT_ID"
          keychain add-certificates
          ALL_BUNDLES=$(app-store-connect list-bundle-ids 2>&1)
          echo "$ALL_BUNDLES"
          BUNDLE_RESOURCE_ID=$(echo "$ALL_BUNDLES" | \
            awk '/^Id:/{id=$2} /com\.deliverystep\.app/{print id; exit}')
          echo "Bundle Resource ID: $BUNDLE_RESOURCE_ID"
          app-store-connect profiles create \
            "$BUNDLE_RESOURCE_ID" \
            --type IOS_APP_STORE \
            --certificate-ids "$CERT_ID" \
            --save
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - ihsanullah.danish5000@gmail.com
        notify:
          success: true
          failure: true
