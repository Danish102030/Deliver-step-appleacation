workflows:
  android-rider-apk:
    name: Android Rider APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - ftp
      android_signing:
        - deliverystep_keystore
      vars:
        PACKAGE_NAME: com.deliverstep.app
        APP_NAME: Delivery Step Rider
      node: 22
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Sync Capacitor
        script: |
          npx cap sync android
      - name: Verify google-services.json
        script: |
          if [ ! -f "android/app/google-services.json" ]; then
            echo "ERROR: google-services.json missing"
            exit 1
          fi
          echo "google-services.json OK"
      - name: Build APK and upload to website
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease
          echo "=== Built APKs ==="
          find . -name "*.apk" -type f
          # We are inside android/ now. Take ONLY our app's release APK (never the SDK's apks).
          APK=$(find . -path "*app/build/outputs/apk/release/*-release.apk" -type f | head -1)
          [ -z "$APK" ] && APK=$(find . -path "*outputs/apk/release*" -name "*.apk" -type f | head -1)
          [ -z "$APK" ] && APK=$(find . -path "*outputs*" -name "*-release.apk" -type f | head -1)
          if [ -z "$APK" ]; then echo "ERROR: our release APK was not produced"; exit 1; fi
          echo "Our APK: $APK  ($(du -h "$APK" | cut -f1))"

          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "FTP login not set in Codemagic 'ftp' group — cannot upload to website."
            exit 0
          fi

          echo "Uploading to Hostinger (host: $FTP_HOST) ..."
          UP=0
          for P in "public_html" "domains/deliverystep.app/public_html" "public_html/deliverystep.app"; do
            echo "-> /$P  (secure FTP, skip cert check)"
            if curl --show-error --fail --ssl-reqd -k -T "$APK" "ftp://$FTP_HOST/$P/rider-app.apk" --user "$FTP_USER:$FTP_PASS" --ftp-create-dirs ; then
              UP=1; echo "UPLOADED via secure FTP to /$P"; break
            fi
            echo "-> /$P  (plain FTP)"
            if curl --show-error --fail -T "$APK" "ftp://$FTP_HOST/$P/rider-app.apk" --user "$FTP_USER:$FTP_PASS" --ftp-create-dirs ; then
              UP=1; echo "UPLOADED via plain FTP to /$P"; break
            fi
          done
          echo ""
          echo "=================================================================="
          echo "=================================================================="
          if [ "$UP" = "1" ]; then
            echo ""
            echo "   DONE! Open this on the phone to install:"
            echo ""
            echo "        https://deliverystep.app/rider-app.apk"
            echo ""
          else
            echo ""
            echo "   Upload failed on all folders. Double-check FTP_HOST/FTP_USER/FTP_PASS"
            echo "   in Codemagic (from Hostinger -> Files -> FTP Accounts)."
            echo ""
          fi
          echo "=================================================================="
          echo "=================================================================="
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/mapping/**/*.txt
    publishing:
      email:
        recipients:
          - ihsanullah.danish5000@gmail.com
        notify:
          success: true
          failure: true

  android-customer-playstore:
    name: Android Customer (Play Store AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - deliverystep_keystore
      vars:
        PACKAGE_NAME: com.deliverstep.app
      node: 22
      java: 21
    scripts:
      - name: Generate customer app (rider base + inlined files + company logo)
        script: |
          set -e
          rm -rf customer && mkdir -p customer/www
          echo '' | openssl base64 -A -d > customer/package.json
          echo '' | openssl base64 -A -d > customer/capacitor.config.json
          echo '' | openssl base64 -A -d > customer/www/index.html
          echo '' | openssl base64 -A -d > /tmp/ds_icons.tar.gz
          cp -r android customer/android
          tar -xzf /tmp/ds_icons.tar.gz -C customer/android/app/src/main/res/
          rm -f customer/android/app/src/main/java/com/deliverstep/app/BootReceiver.java customer/android/app/src/main/java/com/deliverstep/app/OrderMessagingService.java customer/android/app/src/main/java/com/deliverstep/app/RiderForegroundService.java customer/android/capacitor.settings.gradle customer/android/app/capacitor.build.gradle
          echo '' | openssl base64 -A -d > customer/android/app/build.gradle
          echo '' | openssl base64 -A -d > customer/android/app/src/main/AndroidManifest.xml
          echo '' | openssl base64 -A -d > customer/android/app/src/main/java/com/deliverstep/app/MainActivity.java
          echo '' | openssl base64 -A -d > customer/android/app/src/main/res/values/strings.xml
          echo "=== customer applicationId / version ==="
          grep -E "applicationId|versionCode|versionName|targetSdkVersion" customer/android/app/build.gradle
          echo "=== company-logo icons in place ===" && ls customer/android/app/src/main/res/mipmap-xxxhdpi/
      - name: Install dependencies
        script: |
          cd customer
          npm install
      - name: Sync Capacitor (regenerate wiring + copy web assets)
        script: |
          cd customer
          npx cap sync android
      - name: Verify google-services.json (push notifications)
        script: |
          F="customer/android/app/google-services.json"
          if [ ! -f "$F" ]; then echo "ERROR: $F missing"; exit 1; fi
          if grep -q "com.deliverstep.app" "$F"; then echo "google-services.json OK (has com.deliverstep.app)"; else echo "ERROR: no com.deliverstep.app entry"; exit 1; fi
      - name: Build Android App Bundle (AAB) for Play Store
        script: |
          cd customer/android
          chmod +x ./gradlew
          ./gradlew bundleRelease
          echo "=== Built AABs ==="
          find . -path "*outputs/bundle/release/*.aab" -type f
          AAB=$(find . -path "*app/build/outputs/bundle/release/*.aab" -type f | head -1)
          if [ -z "$AAB" ]; then echo "ERROR: release AAB was not produced"; exit 1; fi
          echo "=================================================================="
          echo "   DONE! Download the .aab from Artifacts, then in Google Play"
          echo "   Console -> app -> Production -> Create new release -> upload."
          echo "   AAB: $AAB  ($(du -h "$AAB" | cut -f1))"
          echo "=================================================================="
    artifacts:
      - customer/android/app/build/outputs/bundle/**/*.aab
      - customer/android/app/build/outputs/mapping/**/*.txt
    publishing:
      email:
        recipients:
          - ihsanullah.danish5000@gmail.com
        notify:
          success: true
          failure: true

  ios-app-store:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      vars:
        BUNDLE_ID: com.deliverystep.app
        XCODE_PROJECT: ios/DeliveryStep.xcodeproj
        XCODE_SCHEME: DeliveryStep
    scripts:
      - name: Verify icon and Info.plist
        script: |
          ICONSET="ios/DeliveryStep/Assets.xcassets/AppIcon.appiconset"
          echo "=== AppIcon_1024.png ==="
          sips -g pixelWidth -g pixelHeight "$ICONSET/AppIcon_1024.png"
          echo "=== Contents.json ==="
          cat "$ICONSET/Contents.json"
          echo "=== CFBundleIconName in Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" ios/DeliveryStep/Info.plist
      - name: Set up keychain
        script: keychain initialize
      - name: Create certificate and provisioning profile
        script: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out /tmp/dist_key.pem
          CERT_OUTPUT=$(app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key @file:/tmp/dist_key.pem \
            --save 2>&1)
          echo "$CERT_OUTPUT"
          CERT_ID=$(echo "$CERT_OUTPUT" | grep "^Id:" | awk '{print $2}')
          echo "Certificate ID: $CERT_ID"
          keychain add-certificates
          ALL_BUNDLES=$(app-store-connect list-bundle-ids 2>&1)
          echo "$ALL_BUNDLES"
          BUNDLE_RESOURCE_ID=$(echo "$ALL_BUNDLES" | \
            awk '/^Id:/{id=$2} /com\.deliverystep\.app/{print id; exit}')
          echo "Bundle Resource ID: $BUNDLE_RESOURCE_ID"
          app-store-connect profiles create \
            "$BUNDLE_RESOURCE_ID" \
            --type IOS_APP_STORE \
            --certificate-ids "$CERT_ID" \
            --save
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - ihsanullah.danish5000@gmail.com
        notify:
          success: true
          failure: true

  backup-upload-key:
    name: "🔐 Backup Play Store upload key (run once)"
    max_build_duration: 10
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - deliverystep_keystore
      java: 21
    scripts:
      - name: Copy the upload key + its details for safe keeping
        script: |
          set -e
          mkdir -p key-backup
          cp "$CM_KEYSTORE_PATH" key-backup/deliverystep-upload-key.jks
          SHA1=$(keytool -exportcert -rfc -keystore key-backup/deliverystep-upload-key.jks \
                   -storepass "$CM_KEYSTORE_PASSWORD" -alias "$CM_KEY_ALIAS" \
                 | openssl x509 -noout -fingerprint -sha1 | cut -d= -f2)
          echo "Upload key SHA-1: $SHA1"
          if [ "$SHA1" != "96:FE:AB:40:32:64:44:26:D6:B1:6D:68:01:16:15:0A:EF:BE:E3:FB" ]; then
            echo "This is NOT the key Google Play expects - stopping, nothing saved."
            rm -rf key-backup; exit 1
          fi
          cat > key-backup/KEY-DETAILS.txt <<EOF
          Delivery Step - Google Play UPLOAD KEY (keep private: never share, never put on GitHub)
          App: com.deliverstep.app
          Key file: deliverystep-upload-key.jks
          Key alias: $CM_KEY_ALIAS
          Keystore password: $CM_KEYSTORE_PASSWORD
          Key password: $CM_KEY_PASSWORD
          SHA-1 (Play Console > App integrity > Upload key certificate): $SHA1
          Backed up: $(date -u '+%Y-%m-%d %H:%M UTC')
          EOF
          echo "Backup ready: download both files from Artifacts, save them safely, then delete this build."
    artifacts:
      - key-backup/*
